<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Especial incorporação · Capa</title>
<style>
@font-face{font-family:Poppins;font-weight:500;src:url(../fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(../fonts/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:800;src:url(../fonts/poppins-latin-800-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
/* 1080x1920, mesmo molde das capas da série; o grid do perfil recorta o centro 3:4 (y 240–1680).
   O quadro dela (work/capa_frame.jpg, recortado nela e fora do git) fica na metade de baixo do painel:
   o título ocupa o alto e nada passa pelo rosto. */
#c{position:relative;width:1080px;height:1920px;background:#fff;font-family:Poppins,sans-serif;overflow:hidden}
.top{position:absolute;left:0;right:0;top:110px;text-align:center}
.top .nm{font:700 36px Poppins;color:#111}.top .hd{font:500 28px Poppins;color:#7a7f87;margin-top:6px}
.panel{position:absolute;left:40px;top:270px;width:1000px;height:1380px;border-radius:48px;overflow:hidden;background:#0b1628}
.panel img{position:absolute;left:0;top:560px;width:1000px}
.panel .fade{position:absolute;left:0;right:0;top:0;height:860px;background:linear-gradient(#0b1628 0%,#0b1628 74%,rgba(11,22,40,0) 100%)}
.chip{position:absolute;left:70px;top:70px;border:2px solid #cba236;color:#cba236;border-radius:999px;padding:12px 26px;font:700 26px Poppins;letter-spacing:.2em;background:rgba(203,162,54,.12)}
h1{position:absolute;left:70px;right:70px;top:160px;font:800 84px/1.08 Poppins;color:#fff;letter-spacing:-.01em}
h1 em{font-style:normal;color:#cba236}
.sub{position:absolute;left:70px;right:70px;top:540px;font:500 40px/1.3 Poppins;color:#c8d2e0}
.stk{position:absolute;left:600px;top:1230px;font:800 40px/1.05 Poppins;padding:18px 30px 17px;border-radius:18px;border:6px solid #fff;box-shadow:0 16px 34px rgba(0,0,0,.5);background:#d0524b;color:#fff;transform:rotate(-5deg);text-align:center}
.bot{position:absolute;left:0;right:0;top:1700px;text-align:center;font:700 26px Poppins;letter-spacing:.25em;color:#9aa3ad}
</style>
</head>
<body>
<div id="c">
  <div class="top"><div class="nm">Quetilin Baesso | Advocacia</div><div class="hd">@quetilinbaessoadv</div></div>
  <div class="panel"><img id="foto" src="work/capa_frame.jpg" alt=""><div class="fade"></div>
    <div class="chip">ESPECIAL · CORRETOR</div>
    <h1>À venda… mas <em>não existe</em> no cartório.</h1>
    <div class="sub">O que conferir antes de anunciar um empreendimento na planta.</div>
    <div class="stk">Sem registro de<br>incorporação ✕</div></div>
  <div class="bot">DUE DILIGENCE IMOBILIÁRIA</div>
</div>
<script>
window.READY=Promise.all([document.fonts.ready,new Promise(r=>{const i=document.getElementById('foto');i.complete?r():i.onload=i.onerror=r})]).then(()=>true);
</script>
</body>
</html>
