<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clipe · 12 sinais antes da certidão (Dra. Quetilin)</title>
<style>
@font-face{font-family:Poppins;font-weight:500;src:url(../fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;src:url(../fonts/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(../fonts/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:800;src:url(../fonts/poppins-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:400;src:url(../fonts/lora-latin-400-normal.woff2) format('woff2')}
:root{--navy:#111f34;--navy2:#0a1628;--gold:#cba236;--gold2:#d6b76d;--red2:#d0524b;--green:#3f9b6b;--paper:#f7f8f9}
*{box-sizing:border-box;margin:0;padding:0}
/* camada transparente: o vídeo dela é composto por baixo, no painel */
html,body{background:transparent;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;color:#fff}
#stage *{position:absolute}
#stage b,#stage span,#stage br,#stage i{position:static}
.gold{color:var(--gold)}
#hdr{left:0;top:0;width:1080px;height:520px;background:#fff;color:#111}
#hdr .av{left:56px;top:130px;width:104px;height:104px;border-radius:50%;overflow:hidden;background:#d9b98a;border:3px solid #fff;box-shadow:0 0 0 3px var(--gold)}
#hdr .av img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
#hdr .nm{left:184px;top:142px;font:700 36px Poppins;white-space:nowrap}
#hdr .hd{left:184px;top:190px;font:500 28px Poppins;color:#7a7f87}
#hdr .t1{left:56px;right:56px;top:286px;font:700 50px/1.2 Poppins;color:#0b0b0b}
#hdr .t2{left:56px;right:56px;top:420px;font:400 40px/1.25 Poppins;color:#2b2f36}
#frame{left:22px;top:518px;width:1036px;height:1380px;border-radius:44px;box-shadow:0 0 0 1400px #fff}
/* faixa escura suave atrás das legendas e dos cartões, para leitura sobre o vídeo */
#shade{left:22px;top:1180px;width:1036px;height:718px;background:linear-gradient(rgba(10,22,40,0),rgba(10,22,40,.55) 45%,rgba(10,22,40,.7))}
#cap{left:0;width:1080px;top:1640px;text-align:center}
#cap span.box{position:relative;display:inline-block;background:var(--gold);color:var(--navy2);font:700 50px/1.25 Poppins;padding:8px 24px;border-radius:6px}
#cap .on{color:#fff;text-shadow:0 0 1px #000}
.stk{font:800 40px/1 Poppins;padding:16px 28px 15px;border-radius:16px;border:5px solid #fff;white-space:nowrap;box-shadow:0 14px 30px rgba(0,0,0,.45);transform-origin:50% 50%}
.stk.red{background:var(--red2);color:#fff}.stk.gold{background:var(--gold);color:var(--navy2)}
.stk.white{background:#fff;color:var(--navy);border-color:var(--red2)}.stk.green{background:var(--green);color:#fff}
.stk.navy{background:var(--navy2);color:var(--gold);border-color:var(--gold)}
.list{left:70px;width:940px;top:1250px}
#stage .li{position:relative;display:flex;align-items:center;gap:18px;background:rgba(247,248,249,.96);color:#1b2a40;border-radius:16px;padding:14px 22px;margin-bottom:12px;box-shadow:0 12px 26px rgba(0,0,0,.35);font:600 30px/1.2 Poppins}
#stage .li .x{position:relative;flex:0 0 46px;height:46px;border-radius:50%;background:var(--red2);color:#fff;font:800 26px/46px Poppins;text-align:center}
#stage .li .ar{position:relative;color:#8a2a26;font-weight:800}
#stage .chipc{position:relative;display:inline-block;margin:8px;padding:14px 26px;border-radius:999px;background:rgba(10,22,40,.92);border:2px solid var(--gold);color:#fff;font:700 32px Poppins}
.manual{width:420px;height:560px;border-radius:12px;background:linear-gradient(160deg,#1d2c42,#0f1b2e);border:1px solid rgba(203,162,54,.6);box-shadow:0 30px 70px rgba(0,0,0,.55);transform-origin:50% 50%}
.mod{left:70px;width:940px;top:1250px;background:rgba(247,248,249,.97);border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.4);height:300px;color:#1b2a40}
#stage .mod .tag{position:relative;display:inline-block;margin:8px 6px;padding:12px 24px;border-radius:999px;background:#eef1f5;border:2px solid #cfd6df;font:700 30px Poppins;color:#24324a}
</style>
</head>
<body>
<div id="stage"></div>
<script src="words_cut.js"></script>
<script>
// =====================================================================
//  Clipe: os 12 sinais que aparecem antes de qualquer certidão.
//  Camada de sobreposição (fundo transparente) sincronizada com a fala:
//  window.WORDS = [[início, fim, palavra, índice original], ...] já na
//  linha do tempo cortada. O vídeo dela entra por baixo, no painel.
// =====================================================================
const W=1080,H=1920;
const WORDS=window.WORDS||[],DUR=+((window.CLIPDUR||80)+.9).toFixed(2);
// junta pedaços como "e" + "-mail" que a transcrição separa
for(let i=WORDS.length-1;i>0;i--)if(WORDS[i][2].startsWith('-')){WORDS[i-1][2]+=WORDS[i][2];WORDS[i-1][1]=WORDS[i][1];WORDS.splice(i,1)}
// correções da transcrição automática (só no texto exibido)
const FIX={'comprivenda?':'compra e venda?','head':'red'};
const TX=w=>FIX[w]||w;
// início da palavra pelo índice original da transcrição
// início da n-ésima palavra que começa com o texto dado
const nrm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]/g,'');
const FIND=(s,n=1)=>{let k=0;for(const w of WORDS)if(nrm(w[2]).startsWith(nrm(s))&&++k===n)return w[0];console.error('FIND falhou: '+s);return DUR};
const AT=i=>{const w=WORDS.find(x=>x[3]===i);if(w)return w[0];const n=WORDS.find(x=>x[3]>i);return n?n[0]:DUR};
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),rp=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-x,3),eo4=x=>1-Math.pow(1-x,4);
const win=(t,a,b,f=.3)=>Math.min(rp(t,a-f,a),1-rp(t,b-f*.5,b+f*.5));
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const stage=document.getElementById('stage');
const shade=$(`<div id="shade"></div>`);stage.appendChild(shade);
const L=document.createElement('div');L.style.cssText='left:0;top:0;width:1080px;height:1920px';stage.appendChild(L);
const FR=$(`<div id="frame"></div>`);stage.appendChild(FR);
const hdr=$(`<div id="hdr"><div class="av"><img src="assets/avatar.jpg" onerror="this.remove()"><div style="left:0;top:0;width:100%;height:100%;font:800 40px/104px Poppins;text-align:center;color:#fff;z-index:-1">QB</div></div>
  <div class="nm">Quetilin Baesso | Advocacia</div><div class="hd">@quetilinbaessoadv</div>
  <div class="t1">12 sinais de risco aparecem antes de qualquer certidão.</div>
  <div class="t2">E quase todos estão na conversa.</div></div>`);
stage.appendChild(hdr);

// ---------- adesivos ----------
const STK=[];
function sticker(txt,x,y,r,kind,t,out){const el=$(`<div class="stk ${kind}" style="left:${x}px;top:${y}px">${txt}</div>`);L.appendChild(el);STK.push({el,t,r,out})}
function stickers(t){for(const s of STK){const p=eo4(rp(t,s.t,s.t+.35)),o=cl(rp(t,s.t,s.t+.1))*(s.out?1-rp(t,s.out,s.out+.2):1);
  s.el.style.opacity=o;s.el.style.transform=`translate(-50%,-50%) rotate(${s.r+lerp(10,0,p)+Math.sin(t*2.6+s.t*7)*1.2}deg) scale(${lerp(.55,1,p)})`}}
const T12=FIND('12'),TCERT=FIND('certidao'),TCONV=FIND('conversa'),TURG=FIND('urgencia'),TPAG=FIND('pagamento'),TDESN=FIND('desnecessaria'),
  TRES=FIND('resistencia'),TCERTEZA=FIND('certeza'),TISOL=FIND('isolado'),TSOMA=FIND('soma'),TFLAG=FIND('flag'),TPDF=FIND('pdf'),TMAIL=FIND('e-mail'),TGRAT=FIND('gratuitamente');
sticker('Antes da certidão',760,700,5,'white',TCERT,TURG-.3);
sticker('Está na conversa',300,780,-5,'gold',TCONV,TURG-.3);
sticker('Já viu isso?',780,720,5,'white',TCERTEZA,TISOL-.2);
sticker('Não é um sinal isolado',540,720,-3,'navy',TISOL,TPDF-.3);
sticker('RED FLAG',540,1390,-4,'red',TFLAG,TPDF-.2);
sticker('Grátis ✓',300,1180,-5,'green',TGRAT,DUR);
sticker('Link na bio',760,1440,5,'gold',TMAIL+.4,DUR);

// ---------- cartões ----------
// selo "12 sinais" com contagem
const big=$(`<div style="left:0;width:1080px;top:600px;text-align:center"><div class="n12" style="position:relative;display:inline-block;background:var(--navy2);border:4px solid var(--gold);border-radius:28px;padding:18px 40px;font:800 120px/1 Poppins;color:var(--gold)">12<span style="font:700 40px Poppins;color:#fff;margin-left:16px;vertical-align:middle">SINAIS</span></div></div>`);
const ROWS=['Urgência excessiva para fechar','Pagamento a quem não é o proprietário','Pressa sem motivo na negociação','Resistência em entregar certidões'];
const list=$(`<div class="list">${ROWS.map(r=>`<div class="li"><div class="x" style="background:var(--red2)">!</div><span>${r}</span></div>`).join('')}</div>`);
const rowT=[TURG,TPAG,TDESN,TRES];
// soma de fatores = red flag
const soma=$(`<div style="left:60px;width:960px;top:1200px;text-align:center">${['Urgência','Terceiro','Resistência'].map((s,i)=>`<div class="chipc">${s}</div>${i<2?'<span class="pl" style="position:relative;display:inline-block;font:800 40px Poppins;color:var(--gold);margin:0 2px">+</span>':''}`).join('')}</div>`);
// PDF gratuito
const pdf=$(`<div style="left:600px;top:1000px;width:360px;height:470px;border-radius:12px;background:#f7f8f9;box-shadow:0 30px 70px rgba(0,0,0,.5);transform-origin:50% 50%">
  <div style="left:0;top:0;width:360px;height:96px;border-radius:12px 12px 0 0;background:var(--red2)"></div>
  <div style="left:26px;top:28px;font:800 34px Poppins;color:#fff;letter-spacing:.06em">PDF GRÁTIS</div>
  <div style="left:26px;right:22px;top:124px;font:800 52px/1.05 Poppins;color:#0a1628">12 sinais</div>
  <div style="left:26px;right:22px;top:188px;font:600 26px/1.25 Poppins;color:#24324a">que aparecem antes de qualquer certidão</div>
  <div style="left:26px;top:300px;width:60px;height:4px;background:var(--gold)"></div>
  <div style="left:26px;right:22px;top:322px;font:600 18px Poppins;letter-spacing:.12em;color:#6b7380">QUETILIN BAESSO · ADVOCACIA</div></div>`);
const FOL=$(`<div style="left:0;width:1080px;top:1490px;text-align:center"><div style="position:relative;display:inline-block;background:#fff;color:#111;font:700 36px Poppins;padding:18px 40px;border-radius:14px;box-shadow:0 12px 26px rgba(0,0,0,.35)">Seguir @quetilinbaessoadv</div></div>`);
L.append(big,list,soma,pdf,FOL);
function put(el,{x=0,y=0,s=1,r=0,o=1}){el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o}
// ---------- legendas ----------
const cap=$(`<div id="cap"></div>`);stage.appendChild(cap);
const CAPS=[];{let cur=[];const flush=end=>{if(!cur.length)return;CAPS.push({a:cur[0][0],b:end,w:cur});cur=[]};
  WORDS.forEach((w,i)=>{if(cur.length&&w[0]-cur.at(-1)[1]>.5)flush(cur.at(-1)[1]+.15);cur.push(w);const len=cur.map(x=>TX(x[2])).join(' ').length;
    if(len>=16||/[.,:?!…]$/.test(w[2])&&len>8)flush(i+1<WORDS.length?WORDS[i+1][0]:w[1]+.3)});flush(WORDS.length?WORDS.at(-1)[1]+.4:0)}
let last=-1;function CAP(t){const i=CAPS.findIndex(x=>t>=x.a&&t<x.b);if(i<0){cap.style.opacity=0;return}const x=CAPS[i];
  if(i!==last){cap.innerHTML=`<span class="box">${x.w.map(w=>`<span>${TX(w[2])}</span>`).join(' ')}</span>`;last=i}
  [...cap.querySelectorAll('.box span')].forEach((s,k,a)=>s.className=t>=x.w[k][0]&&(k==a.length-1||t<x.w[k+1][0])?'on':'');
  cap.style.opacity=1;cap.style.transform=`scale(${lerp(.9,1,eo(cl((t-x.a)/.12)))})`}

// ---------- seek ----------
window.seek=function(t){
  // selo 12 sinais (conta de 1 a 12)
  const bo=win(t,T12-.05,TCERT+.6,.3);put(big,{o:bo,s:lerp(.7,1,eo4(cl(bo)))});
  big.querySelector('.n12').firstChild.textContent=String(Math.max(1,Math.round(lerp(1,12,eo(rp(t,T12,T12+.8))))));
  // lista dos sinais
  const lo=win(t,rowT[0]-.1,TISOL,.3);list.style.opacity=lo;
  list.querySelectorAll('.li').forEach((e,i)=>{const p=eo4(rp(t,rowT[i]-.1,rowT[i]+.3));e.style.opacity=p;e.style.transform=`translateX(${lerp(-60,0,p)}px)`});
  // soma de fatores
  const so=win(t,TSOMA-.1,TFLAG+.1,.3);soma.style.opacity=so;
  soma.querySelectorAll('.chipc,.pl').forEach((e,i)=>{const a=TSOMA+i*.18;const p=eo4(rp(t,a,a+.3));e.style.opacity=p;e.style.transform=`scale(${lerp(.8,1,p)})`});
  // PDF
  const po=win(t,TPDF-.1,DUR+1,.35);put(pdf,{o:po,s:lerp(.6,.8,eo4(cl(po))),r:lerp(-10,-4,eo4(cl(po)))});
  const fo=rp(t,DUR-2.2,DUR-1.8);put(FOL,{o:fo,s:lerp(.85,1,eo4(fo))});
  stickers(t);CAP(t);
};
// ---------- pistas de som ----------
function cues(){const C=[],add=(k,x,v=1)=>{if(x>=0&&x<=DUR)C.push([k,+x.toFixed(3),v])};
  add('impact_soft',T12);for(let i=0;i<6;i++)add('tick',T12+i*.13,.4);
  rowT.forEach(x=>add('alert',x,.6));add('slam',TFLAG,.45);add('shimmer',TPDF);add('success',TGRAT);add('click',DUR-2.1);
  for(const s of STK)add('pop',s.t+.02,.7);return C.sort((a,b)=>a[1]-b[1])}
window.META={v:'clipe-12sinais',w:W,h:H,fps:30,dur:DUR,vo:[['voz',0]],cues:cues(),music_shift:TPDF-.4,
  caps:CAPS.map(x=>[+x.a.toFixed(3),+x.b.toFixed(3),x.w.map(w=>TX(w[2])).join(' ')])};
window.READY=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{seek(0);return true});
</script>
</body>
</html>
