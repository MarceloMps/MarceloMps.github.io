<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clipe · 12 sinais antes da certidão (Dra. Quetilin)</title>
<style>
@font-face{font-family:Poppins;font-weight:500;src:url(../fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;src:url(../fonts/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(../fonts/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:800;src:url(../fonts/poppins-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:400;src:url(../fonts/lora-latin-400-normal.woff2) format('woff2')}
:root{--navy:#111f34;--navy2:#0a1628;--gold:#cba236;--gold2:#d6b76d;--red2:#d0524b;--green:#3f9b6b;--paper:#f7f8f9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,sans-serif;color:#fff}
#stage *{position:absolute}
#stage b,#stage span,#stage br,#stage i{position:static}
.gold{color:var(--gold)}
#hdr{left:0;top:0;width:1080px;height:520px;background:#fff;color:#111}
#hdr .av{left:56px;top:130px;width:104px;height:104px;border-radius:50%;overflow:hidden;background:#d9b98a;border:3px solid #fff;box-shadow:0 0 0 3px var(--gold)}
#hdr .av img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
#hdr .nm{left:184px;top:142px;font:700 36px Poppins;white-space:nowrap}
#hdr .hd{left:184px;top:190px;font:500 28px Poppins;color:#7a7f87}
#hdr .t1{left:56px;right:56px;top:286px;font:700 50px/1.2 Poppins;color:#0b0b0b}
#hdr .t2{left:56px;right:56px;top:420px;font:400 40px/1.25 Poppins;color:#2b2f36}
#frame{left:22px;top:518px;width:1036px;height:1380px;border-radius:44px;box-shadow:0 0 0 1400px #fff}
/* faixas suaves no topo (legenda) e embaixo (cartões), longe do rosto */
#shadeT{left:22px;top:518px;width:1036px;height:260px;background:linear-gradient(rgba(10,22,40,.45),rgba(10,22,40,0))}
#shadeB{left:22px;top:1380px;width:1036px;height:518px;background:linear-gradient(rgba(10,22,40,0),rgba(10,22,40,.6) 45%,rgba(10,22,40,.75))}
/* legenda no topo, sobre a estante, acima da cabeça */
#cap{left:0;width:1080px;top:566px;text-align:center}
#cap span.box{position:relative;display:inline-block;background:var(--gold);color:var(--navy2);font:700 50px/1.25 Poppins;padding:8px 24px;border-radius:6px}
#cap .on{color:#fff;text-shadow:0 0 1px #000}
.stk{font:800 40px/1 Poppins;padding:16px 28px 15px;border-radius:16px;border:5px solid #fff;white-space:nowrap;box-shadow:0 14px 30px rgba(0,0,0,.45);transform-origin:50% 50%}
.stk.red{background:var(--red2);color:#fff}.stk.gold{background:var(--gold);color:var(--navy2)}
.stk.white{background:#fff;color:var(--navy);border-color:var(--red2)}.stk.green{background:var(--green);color:#fff}
.stk.navy{background:var(--navy2);color:var(--gold);border-color:var(--gold)}
.sig{left:0;width:1080px;top:690px;text-align:center}
#stage .sig div{position:relative;display:inline-block;background:rgba(208,82,75,.18);border:2px solid var(--red2);color:#ffd0cc;border-radius:999px;padding:12px 28px;font:700 28px Poppins;letter-spacing:.06em}
</style>
</head>
<body>
<div id="stage"></div>
<script src="words_cut.js"></script>
<script>
// =====================================================================
//  Clipe híbrido "12 sinais": a advogada fala para a câmera e, nos
//  trechos de explicação, o painel vira cena animada com os bonequinhos
//  da série (a voz dela continua). Com ela na tela, a legenda fica no
//  topo e os elementos ficam na faixa de baixo, sem cobrir o rosto.
// =====================================================================
const W=1080,H=1920,PX=22,PY=518,PW=1036,PH=1380,GY=1690;
const WORDS=window.WORDS||[],DUR=+((window.CLIPDUR||80)+.9).toFixed(2);
for(let i=WORDS.length-1;i>0;i--)if(WORDS[i][2].startsWith('-')){WORDS[i-1][2]+=WORDS[i][2];WORDS[i-1][1]=WORDS[i][1];WORDS.splice(i,1)}
const FIX={'comprivenda?':'compra e venda?','head':'red'};
const TX=w=>FIX[w]||w;
const AT=i=>{const w=WORDS.find(x=>x[3]===i);if(w)return w[0];const n=WORDS.find(x=>x[3]>i);return n?n[0]:DUR};
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),rp=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-x,3),eo4=x=>1-Math.pow(1-x,4),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const win=(t,a,b,f=.3)=>Math.min(rp(t,a-f,a),1-rp(t,b-f*.5,b+f*.5));
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const stage=document.getElementById('stage');
const cv=document.createElement('canvas');cv.width=W;cv.height=H;stage.appendChild(cv);const c=cv.getContext('2d');
stage.appendChild($(`<div id="shadeT"></div>`));const shadeB=$(`<div id="shadeB"></div>`);stage.appendChild(shadeB);
const L=document.createElement('div');L.style.cssText='left:0;top:0;width:1080px;height:1920px';stage.appendChild(L);
stage.appendChild($(`<div id="frame"></div>`));
stage.appendChild($(`<div id="hdr"><div class="av"><img src="assets/avatar.jpg" onerror="this.remove()"><div style="left:0;top:0;width:100%;height:100%;font:800 40px/104px Poppins;text-align:center;color:#fff;z-index:-1">QB</div></div>
  <div class="nm">Quetilin Baesso | Advocacia</div><div class="hd">@quetilinbaessoadv</div>
  <div class="t1">12 sinais de risco aparecem antes de qualquer certidão.</div>
  <div class="t2">E quase todos estão na conversa.</div></div>`));

// ---------- desenho (bonequinhos e objetos da série) ----------
const COL={navy2:'#0a1628',navy3:'#1d2c42',navy4:'#25364f',gold:'#cba236',gold2:'#d6b76d',red:'#a43b38',red2:'#d0524b',ink:'#e2e8f0',paper:'#f7f8f9',green:'#3f9b6b',facade:'#2a3c58',win:'#0e1a2c',ground:'#0c1727'};
function line(x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function circ(x,y,r){c.beginPath();c.arc(x,y,r,0,6.2832);c.fill()}
function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function person(x,fy,h,o={}){const s=h/160;c.save();c.translate(x,fy-(o.bob||0));c.scale(s*(o.flip?-1:1),s);c.lineCap='round';
  const skin=o.skin||'#e2b48f',type=o.type||'casual',shirt=o.shirt||(type==='suit'?COL.navy4:'#5b6f8e');
  const st=o.step||0;
  c.strokeStyle=type==='suit'?'#18243a':'#33435e';c.lineWidth=12;line(-8,-62,-9-st*10,-2);line(8,-62,9+st*10,-2);
  c.fillStyle='#0b1220';rr(-20-st*10,-6,18,8,4);c.fill();rr(2+st*10,-6,18,8,4);c.fill();
  c.fillStyle=shirt;rr(-22,-120,44,64,14);c.fill();
  if(type==='suit'){c.fillStyle='#f3f5f8';c.beginPath();c.moveTo(-9,-120);c.lineTo(9,-120);c.lineTo(0,-92);c.fill();c.fillStyle=COL.red2;c.beginPath();c.moveTo(-3,-116);c.lineTo(3,-116);c.lineTo(4,-90);c.lineTo(0,-84);c.lineTo(-4,-90);c.fill()}
  if(o.badge){c.fillStyle=COL.gold;rr(-20,-74,40,13,3);c.fill();c.fillStyle=COL.navy2;c.font='800 9px Poppins';c.textAlign='center';c.fillText(o.badge,0,-64.5)}
  const arm=(sx,a,side)=>{const ex=sx+side*Math.sin(a)*50,ey=-112+Math.cos(a)*50;c.strokeStyle=shirt;c.lineWidth=11;line(sx,-112,ex,ey);c.fillStyle=skin;circ(ex,ey,7);return[ex,ey]};
  arm(-19,o.aL??.18,-1);const hr=arm(19,o.aR??.18,1);
  if(o.paper){c.save();c.translate(hr[0],hr[1]);c.rotate(-.2);c.fillStyle=COL.paper;c.fillRect(-4,-26,26,34);c.fillStyle='#c5ccd6';for(let i=0;i<4;i++)c.fillRect(0,-20+i*7,18,3);if(o.paperOk){c.fillStyle=COL.green;circ(16,4,7)}c.restore()}
  if(o.phone){c.save();c.translate(hr[0],hr[1]);c.fillStyle='#0b1220';rr(-7,-30,16,30,4);c.fill();c.fillStyle='#7fb3e6';c.fillRect(-4,-26,10,20);c.restore()}
  c.fillStyle=skin;circ(0,-142,21);
  c.fillStyle=o.hair||'#2a1c14';c.beginPath();c.arc(0,-147,21,Math.PI*1.05,Math.PI*1.95);c.fill();if(o.long){c.fillRect(-21,-150,8,34);c.fillRect(13,-150,8,34)}
  const m=o.mood||'neutral';c.fillStyle=COL.navy2;circ(-7,-143,2.8);circ(7,-143,2.8);c.strokeStyle=COL.navy2;c.lineWidth=3;
  if(m==='angry'){line(-13,-153,-3,-149);line(13,-153,3,-149);c.beginPath();c.arc(0,-124,7,1.15*Math.PI,1.85*Math.PI);c.stroke()}
  else if(m==='shock'){c.beginPath();c.ellipse(0,-129,5,7,0,0,6.3);c.fill()}
  else if(m==='worried'){line(-12,-151,-3,-155);line(12,-151,3,-155);line(-5,-130,5,-131);c.fillStyle='#7fb3e6';c.beginPath();c.moveTo(19,-158);c.quadraticCurveTo(25,-148,19,-145);c.quadraticCurveTo(13,-148,19,-158);c.fill()}
  else if(m==='happy'){c.beginPath();c.arc(0,-136,8,.15*Math.PI,.85*Math.PI);c.stroke()}
  else line(-5,-131,5,-131);
  c.restore()}
function bubble(x,y,txt,a,o={}){if(a<=0)return;const fs=o.fs||32;c.save();c.font=`700 ${fs}px Poppins`;const w=c.measureText(txt).width+40,h=fs+30,bx=x-w*(o.ax??.5),by=y-h-18,p=eo4(cl(a));
  c.translate(x,y);c.scale(lerp(.6,1,p),lerp(.6,1,p));c.translate(-x,-y);c.globalAlpha=cl(a*3)*(o.fade??1);c.fillStyle=o.bg||'#fff';c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=16;rr(bx,by,w,h,18);c.fill();
  c.beginPath();c.moveTo(x-12,by+h-2);c.lineTo(x,y);c.lineTo(x+14,by+h-2);c.fill();c.shadowBlur=0;c.fillStyle=o.fg||COL.navy2;c.textBaseline='middle';c.fillText(txt,bx+20,by+h/2+1);c.restore()}
function board(cx,cy,w,h,txt,o={}){c.save();c.translate(cx,cy);c.rotate(o.r||0);
  c.fillStyle=o.bg||COL.gold;c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=12;rr(-w/2,-h/2,w,h,8);c.fill();c.shadowBlur=0;
  c.strokeStyle=o.bd||COL.navy2;c.lineWidth=4;rr(-w/2+5,-h/2+5,w-10,h-10,5);c.stroke();
  let fs=h*.44;c.font=`800 ${fs}px Poppins`;const mw=c.measureText(txt).width;if(mw>w*.84){fs*=w*.84/mw;c.font=`800 ${fs}px Poppins`}
  c.fillStyle=o.fg||COL.navy2;c.textAlign='center';c.textBaseline='middle';c.fillText(txt,0,2);c.restore()}
// prédio: 5 andares + térreo; o apto 302 é a janela da direita do 3º andar
function stampC(cx,cy,txt,col,p,rot){if(p<=0)return;c.save();c.translate(cx,cy);c.rotate(rot);const s=lerp(1.8,1,eo4(p));c.scale(s,s);c.globalAlpha=cl(p*1.6);
  c.font='800 40px Poppins';const w=c.measureText(txt).width+44;c.strokeStyle=col;c.lineWidth=6;rr(-w/2,-34,w,68,10);c.stroke();c.fillStyle=col;c.textAlign='center';c.textBaseline='middle';c.fillText(txt,0,3);c.restore()}
function ground(){c.fillStyle=COL.ground;c.fillRect(-600,GY,W+1200,H);c.fillStyle='rgba(203,162,54,.35)';c.fillRect(-600,GY,W+1200,3)}
function key(x,y,r,a){c.save();c.translate(x,y);c.rotate(r);c.globalAlpha=a;c.strokeStyle=COL.gold;c.lineWidth=8;c.beginPath();c.arc(0,0,22,0,6.3);c.stroke();c.fillStyle=COL.gold;c.fillRect(20,-5,60,10);c.fillRect(60,0,8,20);c.fillRect(74,0,8,14);c.restore()}
function label(x,txt,col){c.save();c.font='600 26px Poppins';c.fillStyle=col||'#c8d2e0';c.textAlign='center';c.fillText(txt,x,GY+46);c.restore()}
function clockIcon(x,y,r,t,spd){c.save();c.translate(x,y);c.fillStyle='#f3f5f8';circ(0,0,r);c.strokeStyle=COL.red2;c.lineWidth=r*.12;c.beginPath();c.arc(0,0,r,0,6.3);c.stroke();
  c.strokeStyle=COL.navy2;c.lineCap='round';c.lineWidth=r*.1;const a=t*spd;line(0,0,Math.sin(a)*r*.75,-Math.cos(a)*r*.75);c.lineWidth=r*.13;line(0,0,Math.sin(a/12)*r*.5,-Math.cos(a/12)*r*.5);c.restore()}
function coin(x,y,r){c.save();c.fillStyle=COL.gold;circ(x,y,r);c.fillStyle=COL.navy2;c.font=`800 ${r*.9}px Poppins`;c.textAlign='center';c.textBaseline='middle';c.fillText('R$',x,y+2);c.restore()}
function folderLock(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#c79a3a';rr(-60,-40,50,16,4);c.fill();c.fillStyle='#e0b453';rr(-60,-30,120,84,8);c.fill();
  c.fillStyle=COL.navy2;rr(-16,6,32,26,5);c.fill();c.strokeStyle=COL.navy2;c.lineWidth=6;c.beginPath();c.arc(0,6,11,Math.PI,0);c.stroke();c.restore()}
function redFlag(x,y,p,t){if(p<=0)return;const h=lerp(0,420,eo(p));c.save();c.fillStyle='#c8d2e0';c.fillRect(x-6,y-h,12,h);
  if(p>.4){const q=eo(rp(p,.4,1)),fw=330*q,fh=150;c.fillStyle=COL.red2;c.beginPath();c.moveTo(x+6,y-h);
    for(let i=0;i<=20;i++){const u=i/20;c.lineTo(x+6+u*fw,y-h+Math.sin(u*6+t*6)*10*u)}for(let i=20;i>=0;i--){const u=i/20;c.lineTo(x+6+u*fw,y-h+fh+Math.sin(u*6+t*6)*10*u)}c.closePath();c.fill();
    c.globalAlpha=q;c.fillStyle='#fff';c.font='800 50px Poppins';c.textAlign='center';c.textBaseline='middle';c.fillText('RED FLAG',x+6+fw/2,y-h+fh/2+Math.sin(3+t*6)*5)}
  c.restore()}
function arrowDash(x1,y1,x2,y2,p,col,t){if(p<=0)return;c.save();c.strokeStyle=col;c.lineWidth=6;c.setLineDash([16,12]);c.lineDashOffset=-t*60;const mx=(x1+x2)/2,my=Math.min(y1,y2)-120;
  c.beginPath();c.moveTo(x1,y1);c.quadraticCurveTo(mx,my,lerp(x1,x2,p),lerp(y1,y2,p));c.stroke();c.restore()}

// ---------- tempos (índices das palavras da transcrição) ----------
const A1=AT(23)-.15, A1E=AT(67)-.15;          // cena animada: os sinais (urgência, terceiro, pressa, resistência)
const B1=AT(23),B2=AT(31),B3=AT(45),B4=AT(55),B2X=AT(39);
const A2=AT(91)-.15, A2E=AT(106)-.1;          // cena animada: a soma vira red flag
const TFLAG=AT(103);
const animA=t=>Math.max(win(t,A1,A1E,.35),win(t,A2,A2E,.35));

// ---------- cena animada ----------
function scene(t,a){if(a<=0)return;c.save();c.globalAlpha=a;
  const g=c.createLinearGradient(0,PY,0,PY+PH);g.addColorStop(0,'#1d2a40');g.addColorStop(1,'#070f1c');c.fillStyle=g;c.fillRect(PX,PY,PW,PH);
  c.fillStyle='rgba(203,162,54,.06)';for(let x=PX;x<PX+PW;x+=60)c.fillRect(x,PY,1,PH);
  c.fillStyle=COL.ground;c.fillRect(PX,GY,PW,PY+PH-GY);c.fillStyle='rgba(203,162,54,.35)';c.fillRect(PX,GY,PW,3);
  const s=lerp(1.04,1,eo(cl(a)))*1.25;c.translate(540,GY);c.scale(s,s);c.translate(-540,-GY);
  if(t<A1E+.5)signals(t);else soma(t);
  c.restore()}
function signals(t){
  const b2=t>=B2&&t<B3,b3=t>=B3&&t<B4,b4=t>=B4;
  // terceiro entra pela esquerda no sinal 2
  const tp=b2?eo(rp(t,B2,B2+.6)):0;
  if(tp>0){c.save();c.globalAlpha=tp;person(lerp(-40,200,tp),GY,250,{type:'casual',shirt:'#6a7f4a',mood:'neutral',skin:'#d9a982',hair:'#3a2a1a'});label(200,'Terceiro','#ffb3ad');c.restore()}
  const sellerArm=(t>=B1&&t<B2)?2.6:b2?(t>B2+.8?2.2:.3):b3?2.6:.3;
  person(390,GY,270,{type:'casual',shirt:'#7a5f8e',mood:b4?'neutral':'happy',aR:sellerArm,aL:b4?2.9:.25,skin:'#f1d0b5',hair:'#8a5a2a',long:true,flip:false});label(390,'Vendedor');
  person(590,GY,280,{type:'suit',badge:'CORRETOR',mood:t>B4+1?'worried':'neutral',aR:b4&&t<B4+2.4?2.4:.3,skin:'#e2b48f',hair:'#1e1712',flip:true});label(590,'Corretor');
  person(790,GY,265,{type:'casual',shirt:'#4f7a8a',mood:b2&&t>B2X?'shock':'neutral',aR:b2?1.2:.25,skin:'#c99068',flip:true});label(790,'Comprador');
  // sinal 1: relógio acelerado
  if(t>=B1&&t<B2+.2){const a=rp(t,B1,B1+.3)*(1-rp(t,B2-.1,B2+.2));c.save();c.globalAlpha=a;clockIcon(390,GY-470,56,t,14);c.restore();
    bubble(430,GY-330,'Fecha hoje, senão vendo pra outro!',rp(t,B1+.3,B1+.6)*(1-rp(t,B2-.1,B2+.1)),{ax:.25,fs:28})}
  // sinal 2: pagamento para quem não é o dono
  if(b2){bubble(420,GY-330,'Paga direto na conta dele.',rp(t,B2+.8,B2+1.1),{ax:.3,fs:28});
    const ap=eo(rp(t,B2+1.4,B2+2.4));arrowDash(790,GY-200,215,GY-200,ap,COL.gold,t);
    if(ap>0){const cp=rp(t,B2+1.4,B2+3.2)%1;coin(lerp(790,215,eio(cp)),GY-200-Math.sin(cp*Math.PI)*160,24)}
    stampC(495,GY-260,'NÃO É O PROPRIETÁRIO',COL.red2,rp(t,B2X,B2X+.35),-.06)}
  // sinal 3: pressa sem motivo
  if(b3){const a=rp(t,B3,B3+.3);c.save();c.globalAlpha=a;clockIcon(590,GY-480,62,t,22);c.restore();
    for(let k=0;k<3;k++){const p=(t*1.6+k/3)%1;c.save();c.globalAlpha=a*(1-p);c.fillStyle=COL.paper;c.translate(700+p*110,GY-560-p*160);c.rotate(p*2);rr(-30,-38,60,76,6);c.fill();c.restore()}
    bubble(400,GY-330,'Assina logo, os papéis vêm depois.',rp(t,B3+.4,B3+.7),{ax:.25,fs:28})}
  // sinal 4: resistência em entregar certidões
  if(b4){bubble(610,GY-340,'Me envia as certidões?',rp(t,B4+.2,B4+.5),{ax:.5,fs:28,bg:COL.gold});
    bubble(360,GY-340,'Depois eu mando…',rp(t,B4+1.6,B4+1.9),{ax:.4,fs:28});
    c.save();c.globalAlpha=rp(t,B4+1.2,B4+1.6);folderLock(300,GY-150,.7);c.restore()}}
function soma(t){
  const T0=A2,p=k=>eo(rp(t,T0+.2+k*.35,T0+.6+k*.35)),m=eio(rp(t,TFLAG-1.2,TFLAG-.2));
  const xs=[300,540,780].map(x=>lerp(x,540,m*.55)),y=GY-380;
  c.save();c.globalAlpha=p(0)*(1-rp(t,TFLAG-.1,TFLAG+.3));clockIcon(xs[0],y,64,t,14);c.restore();
  c.save();c.globalAlpha=p(1)*(1-rp(t,TFLAG-.1,TFLAG+.3));coin(xs[1],y,64);c.restore();
  c.save();c.globalAlpha=p(2)*(1-rp(t,TFLAG-.1,TFLAG+.3));folderLock(xs[2],y,1.1);c.restore();
  c.save();c.globalAlpha=Math.min(p(1),p(2))*(1-m);c.fillStyle=COL.gold;c.font='800 70px Poppins';c.textAlign='center';c.textBaseline='middle';c.fillText('+',420,y);c.fillText('+',660,y);c.restore();
  ['Urgência','Terceiro','Resistência'].forEach((s,k)=>{c.save();c.globalAlpha=p(k)*(1-m);c.fillStyle='#c8d2e0';c.font='700 30px Poppins';c.textAlign='center';c.fillText(s,[300,540,780][k],y+100);c.restore()});
  redFlag(400,GY,rp(t,TFLAG-.1,TFLAG+.9),t)}

// ---------- selos dos sinais (aparecem embaixo da legenda) ----------
const SIG=['SINAL 1 de 12 · Urgência excessiva','SINAL 2 de 12 · Pagamento a terceiro','SINAL 3 de 12 · Pressa sem motivo','SINAL 4 de 12 · Resistência com documentos','A SOMA DOS FATORES'];
const sig=SIG.map(s=>{const e=$(`<div class="sig"><div>${s}</div></div>`);L.appendChild(e);return e});
const sigT=[[B1,B2],[B2,B3],[B3,B4],[B4,A1E],[A2,A2E]];

// ---------- adesivos e cartões com ela na tela (faixa de baixo) ----------
const STK=[];
function sticker(txt,x,y,r,kind,t,out){const el=$(`<div class="stk ${kind}" style="left:${x}px;top:${y}px">${txt}</div>`);L.appendChild(el);STK.push({el,t,r,out})}
function stickers(t){for(const s of STK){const p=eo4(rp(t,s.t,s.t+.35)),o=cl(rp(t,s.t,s.t+.1))*(s.out?1-rp(t,s.out,s.out+.2):1);
  s.el.style.opacity=o;s.el.style.transform=`translate(-50%,-50%) rotate(${s.r+lerp(10,0,p)+Math.sin(t*2.6+s.t*7)*1.2}deg) scale(${lerp(.55,1,p)})`}}
sticker('Antes da certidão',320,1660,-5,'white',AT(10),A1-.1);
sticker('Está na conversa',760,1750,5,'gold',AT(22),A1-.1);
sticker('Já viu isso?',540,1640,-4,'white',AT(69),AT(80)-.2);
sticker('Não é um sinal isolado',540,1700,3,'navy',AT(87),A2-.05);
sticker('Link na bio',300,1560,-5,'gold',AT(142),DUR);
sticker('Grátis ✓',290,1690,4,'green',AT(147),DUR);
const big=$(`<div style="left:0;width:1080px;top:1430px;text-align:center"><div class="n12" style="position:relative;display:inline-block;background:var(--navy2);border:4px solid var(--gold);border-radius:28px;padding:16px 38px;font:800 110px/1 Poppins;color:var(--gold)">12<span style="font:700 38px Poppins;color:#fff;margin-left:16px;vertical-align:middle">SINAIS</span></div></div>`);
const pdf=$(`<div style="left:620px;top:1330px;width:360px;height:470px;border-radius:12px;background:#f7f8f9;box-shadow:0 30px 70px rgba(0,0,0,.5);transform-origin:50% 50%">
  <div style="left:0;top:0;width:360px;height:96px;border-radius:12px 12px 0 0;background:var(--red2)"></div>
  <div style="left:26px;top:28px;font:800 34px Poppins;color:#fff;letter-spacing:.06em">PDF GRÁTIS</div>
  <div style="left:26px;right:22px;top:124px;font:800 52px/1.05 Poppins;color:#0a1628">12 sinais</div>
  <div style="left:26px;right:22px;top:188px;font:600 26px/1.25 Poppins;color:#24324a">que aparecem antes de qualquer certidão</div>
  <div style="left:26px;top:300px;width:60px;height:4px;background:var(--gold)"></div>
  <div style="left:26px;right:22px;top:322px;font:600 18px Poppins;letter-spacing:.12em;color:#6b7380">QUETILIN BAESSO · ADVOCACIA</div></div>`);
const FOL=$(`<div style="left:0;width:1080px;top:1790px;text-align:center"><div style="position:relative;display:inline-block;background:#fff;color:#111;font:700 34px Poppins;padding:16px 36px;border-radius:14px;box-shadow:0 12px 26px rgba(0,0,0,.35)">Seguir @quetilinbaessoadv</div></div>`);
L.append(big,pdf,FOL);
function put(el,{x=0,y=0,s=1,r=0,o=1}){el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o}

// ---------- legendas (topo) ----------
const cap=$(`<div id="cap"></div>`);stage.appendChild(cap);
const CAPS=[];{let cur=[];const flush=end=>{if(!cur.length)return;CAPS.push({a:cur[0][0],b:end,w:cur});cur=[]};
  WORDS.forEach((w,i)=>{if(cur.length&&w[0]-cur.at(-1)[1]>.5)flush(cur.at(-1)[1]+.15);cur.push(w);const len=cur.map(x=>TX(x[2])).join(' ').length;
    if(len>=16||/[.,:?!…]$/.test(w[2])&&len>8)flush(i+1<WORDS.length?WORDS[i+1][0]:w[1]+.3)});flush(WORDS.length?WORDS.at(-1)[1]+.4:0)}
let last=-1;function CAP(t){const i=CAPS.findIndex(x=>t>=x.a&&t<x.b);if(i<0){cap.style.opacity=0;return}const x=CAPS[i];
  if(i!==last){cap.innerHTML=`<span class="box">${x.w.map(w=>`<span>${TX(w[2])}</span>`).join(' ')}</span>`;last=i}
  [...cap.querySelectorAll('.box span')].forEach((s,k,a)=>s.className=t>=x.w[k][0]&&(k==a.length-1||t<x.w[k+1][0])?'on':'');
  cap.style.opacity=1;cap.style.transform=`scale(${lerp(.9,1,eo(cl((t-x.a)/.12)))})`}

// ---------- seek ----------
window.seek=function(t){
  c.clearRect(0,0,W,H);const an=animA(t);scene(t,an);shadeB.style.opacity=1-an;
  sig.forEach((e,i)=>{const o=win(t,sigT[i][0],sigT[i][1],.25);e.style.opacity=o;e.style.transform=`translateY(${lerp(-14,0,eo4(cl(o)))}px)`});
  const bo=win(t,AT(1)-.05,AT(11)+.4,.3);put(big,{o:bo,s:lerp(.7,1,eo4(cl(bo)))});
  big.querySelector('.n12').firstChild.textContent=String(Math.max(1,Math.round(lerp(1,12,eo(rp(t,AT(1),AT(1)+.8))))));
  const po=win(t,AT(112)-.1,DUR+1,.35);put(pdf,{o:po,s:lerp(.5,.68,eo4(cl(po))),r:lerp(-10,-4,eo4(cl(po)))});
  const fo=rp(t,DUR-2.2,DUR-1.8);put(FOL,{o:fo,s:lerp(.85,1,eo4(fo))});
  stickers(t);CAP(t);
};
// ---------- pistas de som ----------
function cues(){const C=[],add=(k,x,v=1)=>{if(x>=0&&x<=DUR)C.push([k,+x.toFixed(3),v])};
  add('impact_soft',AT(1));for(let i=0;i<6;i++)add('tick',AT(1)+i*.13,.4);
  [A1,A2].forEach(x=>add('whoosh',x,.7));[A1E,A2E].forEach(x=>add('swish',x,.8));
  [B1,B2,B3,B4].forEach(x=>add('alert',x+.05,.6));add('stamp',B2X);add('paper',B4+1.2);
  for(let i=0;i<3;i++)add('pop',A2+.2+i*.35,.7);add('slam',TFLAG,.5);
  add('shimmer',AT(112));add('success',AT(147));add('click',DUR-2.1);
  for(const s of STK)add('pop',s.t+.02,.7);return C.sort((a,b)=>a[1]-b[1])}
window.META={v:'clipe-12sinais',w:W,h:H,fps:30,dur:DUR,vo:[['voz',0]],cues:cues(),music_shift:AT(106)-.3,
  caps:CAPS.map(x=>[+x.a.toFixed(3),+x.b.toFixed(3),x.w.map(w=>TX(w[2])).join(' ')])};
window.READY=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{seek(0);return true});
</script>
