<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>QB Group — Campanha Negociações Imobiliárias</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:400;src:url(fonts/lora-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:400;font-style:italic;src:url(fonts/lora-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:500;src:url(fonts/lora-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:600;src:url(fonts/lora-latin-600-normal.woff2) format('woff2')}
:root{
  /* Paleta extraída de qbgroupsolutions.lovable.app (oklch → hex) */
  --navy:#111f34; --navy2:#0a1628; --navy3:#1d2c42; --navy4:#25364f;
  --gold:#cba236; --gold2:#d6b76d; --gold3:#856717;
  --red:#a43b38; --red2:#d0524b;
  --ink:#e2e8f0; --mute:#848d98; --paper:#f7f8f9; --cream:#fcf7e6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy2);overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--navy2);font-family:Poppins,sans-serif;color:var(--ink)}
#stage *{position:absolute}
#stage b,#stage span,#stage br{position:static}
canvas{left:0;top:0}
.scene{left:0;top:0;width:100%;height:100%;transform-origin:50% 50%}
.paper{background:var(--paper);color:var(--navy);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.08);overflow:hidden}
.paper .hd{left:44px;right:44px;top:40px;font:600 15px Poppins;letter-spacing:.22em;color:#6b7380}
.paper .tt{left:44px;right:44px;top:66px;font:700 30px/1.15 Poppins;color:var(--navy)}
.paper .bar{height:11px;border-radius:6px;background:#dde1e7;left:44px}
.paper .ln{left:44px;right:44px;font:500 19px/1.3 Lora;color:#2b3445}
.tag{font:700 17px Poppins;letter-spacing:.16em;padding:8px 14px;border-radius:6px;color:#fff;background:var(--red);white-space:nowrap}
.hl{border:4px solid var(--red2);border-radius:8px;background:rgba(208,82,75,.12)}
.kw{left:0;width:100%;text-align:center;font-weight:800;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.gold{color:var(--gold)}
.panel{background:linear-gradient(180deg,var(--navy3),var(--navy));border:1px solid rgba(255,255,255,.1);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.chip{border:1.5px solid rgba(203,162,54,.55);color:var(--gold);border-radius:999px;font:600 20px Poppins;letter-spacing:.24em;padding:12px 26px;white-space:nowrap}
.bubble{background:#f1f3f6;color:#1b2536;border-radius:18px 18px 18px 4px;font:500 23px/1.3 Poppins;padding:14px 20px;white-space:nowrap}
.bubble b{font-weight:700;color:#5c6676;display:block;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.step{background:linear-gradient(90deg,rgba(29,44,66,.95),rgba(17,31,52,.92));border:1px solid rgba(255,255,255,.1);border-radius:18px}
.step .n{width:66px;height:66px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);font:700 28px/62px Poppins;text-align:center}
.step .l{font:600 34px Poppins;color:#fff;white-space:nowrap}
.step .ck{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--navy2);font:800 26px/44px Poppins;text-align:center}
.ben{background:linear-gradient(90deg,rgba(29,44,66,.92),rgba(17,31,52,.75));border:1px solid rgba(255,255,255,.09);border-left:4px solid var(--gold);border-radius:16px}
.ben .ic{width:84px;height:84px;border-radius:50%;border:2px solid rgba(203,162,54,.7);display:flex;align-items:center;justify-content:center}
.ben .ic svg{position:static;width:44px;height:44px}
.ben .tx{font:600 36px/1.22 Poppins;color:#fff}
.btn{background:var(--gold);color:var(--navy2);font:800 40px Poppins;letter-spacing:.06em;border-radius:14px;text-align:center;white-space:nowrap}
#cap{left:60px;right:60px;text-align:center}
#cap span.box{position:relative;display:inline-block;background:rgba(10,22,40,.82);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 26px;font:600 42px/1.3 Poppins;color:#fff}
.tall #cap span.box{font-size:52px;padding:14px 30px}
#cap span.box span{position:static}
#cap .on{color:var(--gold)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ======================================================================
//  QB GROUP SOLUTIONS — "Negociações Imobiliárias com Segurança Jurídica"
//  Composição determinística: window.seek(t) desenha o quadro do instante t.
//  ?v=feed (1080x1350) | story (1080x1920) | short (1080x1920, 15 s)
// ======================================================================
const V = new URLSearchParams(location.search).get('v') || 'feed';
const W = 1080, H = V === 'feed' ? 1350 : 1920, TALL = V !== 'feed';

// ---------- narração (duração real de cada fala, em segundos) ----------
const VO = {
  s1a:[1.86,'O negócio caiu na véspera da escritura.'],
  s1b:[1.76,'E o risco já estava nos documentos.'],
  s2a:[3.17,'Uma informação não verificada pode comprometer a negociação inteira.'],
  s2b:[4.91,'O problema nem sempre aparece na visita: está nos registros e nos detalhes que passam despercebidos.'],
  s3a:[2.07,'Você é advogado ou corretor de imóveis?'],
  s3b:[4.56,'Não basta conduzir a negociação. É preciso saber quais riscos investigar.'],
  s4a:[4.48,'Com o curso Negociações Imobiliárias com Segurança Jurídica, da QB Group Solutions,'],
  s4b:[3.78,'você desenvolve uma visão estruturada da operação, da reserva ao registro.'],
  s5a:[4.90,'Mais critério para identificar sinais de alerta. Mais clareza para comunicar riscos.'],
  s6a:[1.45,'Não espere um problema aparecer.'],
  s6b:[5.60,'Conheça o curso Negociações Imobiliárias com Segurança Jurídica. Acesse a página e saiba mais.'],
  c2:[3.99,'Negociações Imobiliárias com Segurança Jurídica, da QB Group Solutions.'],
  c3:[3.24,'Conheça o curso. Acesse a página e saiba mais.'],
};
const NOSUB = new Set(['s1a','s1b']);   // o gancho já é a tipografia na tela

// ---------- montagem de cada versão ----------
const CUTS = {
  feed:{dur:44.6, scenes:[['s1',0,4.6],['s2',4.6,13.4],['s3',13.4,20.7],['s4',20.7,29.8],['s5',29.8,35.2],['s6',35.2,44.6]],
        vo:[['s1a',.35],['s1b',2.55],['s2a',4.8],['s2b',8.2],['s3a',13.6],['s3b',15.85],['s4a',21.0],['s4b',25.6],['s5a',30.0],['s6a',35.4],['s6b',37.1]]},
  story:{dur:39.6, scenes:[['s1',0,4.6],['s2',4.6,13.4],['s3',13.4,16.0],['s4',16.0,25.0],['s5',25.0,30.4],['s6',30.4,39.6]],
        vo:[['s1a',.35],['s1b',2.55],['s2a',4.8],['s2b',8.2],['s3a',13.6],['s4a',16.3],['s4b',20.9],['s5a',25.2],['s6a',30.6],['s6b',32.3]]},
  short:{dur:15.0, scenes:[['s1',0,4.6],['s4',4.6,9.6],['s6',9.6,15.0]],
        vo:[['s1a',.35],['s1b',2.55],['c2',4.9],['c3',10.4]]},
};
const CUT = CUTS[V];

// ---------- utilidades ----------
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const rp=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
function put(el,{x=0,y=0,s=1,r=0,o=1,sx,sy,blur=0,extra=''}){
  el.style.transform=`translate(${x}px,${y}px) scale(${sx??s},${sy??s}) rotate(${r}deg) ${extra}`;
  el.style.opacity=o; el.style.filter=blur>0.05?`blur(${blur}px)`:'none';
}
function wordTimes(text,start,dur){
  const w=text.split(' '),tot=w.reduce((a,b)=>a+b.length+1,0);let acc=0;
  return w.map(x=>{const t0=start+dur*acc/tot;acc+=x.length+1;return t0});
}

const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';if(TALL)stage.classList.add('tall');
const bg=document.createElement('canvas');bg.width=W;bg.height=H;stage.appendChild(bg);
const g=bg.getContext('2d');

const SC={};
function scene(id){const el=$(`<div class="scene" id="${id}"></div>`);stage.appendChild(el);SC[id]=el;return el}

// layout por formato
const L = TALL ? {cy:900, capY:1460, top:250, hlS:104, kwS:92, kwY:1130, cardY:300}
               : {cy:600, capY:1170, top:70,  hlS:96,  kwS:80, kwY:905,  cardY:205};

// ======================================================================
//  CENA 1 — GANCHO
// ======================================================================
const s1=scene('s1');
const toast=$(`<div style="left:${(W-820)/2}px;top:${L.top}px;width:820px;height:108px;border-radius:20px;background:rgba(29,44,66,.96);border:1px solid rgba(208,82,75,.6);box-shadow:0 20px 50px rgba(0,0,0,.5)">
  <div style="left:24px;top:24px;width:60px;height:60px;border-radius:50%;background:var(--red);font:800 36px/60px Poppins;text-align:center;color:#fff">!</div>
  <div style="left:104px;top:20px;font:700 27px Poppins;color:#fff;white-space:nowrap">Pendência encontrada na matrícula</div>
  <div style="left:104px;top:58px;font:500 22px Poppins;color:var(--mute);white-space:nowrap">Escritura agendada para amanhã · 10h00</div>
  <div style="right:26px;top:22px;font:500 19px Poppins;color:var(--mute)">agora</div></div>`);
s1.appendChild(toast);
const hl1=$(`<div style="left:0;width:${W}px;top:${L.top+(TALL?190:150)}px;text-align:center;font:800 ${L.hlS}px/1.04 Poppins;color:#fff;letter-spacing:-.02em"></div>`);
s1.appendChild(hl1);
const HL1=['O NEGÓCIO CAIU','NA VÉSPERA','DA ESCRITURA.'];
hl1.innerHTML=HL1.map((l,i)=>`<div style="position:relative">${l.split(' ').map(w=>`<span style="position:relative;display:inline-block;margin:0 .14em">${w}</span>`).join('')}</div>`).join('');
const hl1w=[...hl1.querySelectorAll('span')];
const hl1t=wordTimes(HL1.join(' '),.35,1.86);

const docY = TALL? 900 : 640;
const doc1=$(`<div class="paper" style="left:${(W-640)/2}px;top:${docY}px;width:640px;height:820px;transform-origin:50% 30%">
  <div class="hd">TABELIONATO DE NOTAS</div>
  <div class="tt">ESCRITURA PÚBLICA DE<br>COMPRA E VENDA</div>
  <div style="left:44px;top:160px;width:120px;height:5px;background:var(--gold)"></div>
  <div class="ln" style="top:190px">Livro 1.248 · Folhas 077/079</div>
  ${[240,268,296,324].map((y,i)=>`<div class="bar" style="top:${y}px;width:${[540,500,552,380][i]}px"></div>`).join('')}
  <div class="ln" style="top:362px;font-weight:600">OUTORGANTE VENDEDOR</div>
  ${[400,428].map((y,i)=>`<div class="bar" style="top:${y}px;width:${[520,430][i]}px"></div>`).join('')}
  <div class="ln" style="top:466px;font-weight:600">OUTORGADO COMPRADOR</div>
  ${[504,532].map((y,i)=>`<div class="bar" style="top:${y}px;width:${[540,350][i]}px"></div>`).join('')}
  <div class="ln" style="top:570px;font-weight:600">DO IMÓVEL — Matrícula nº 48.217</div>
  ${[608,636].map((y,i)=>`<div class="bar" style="top:${y}px;width:${[552,470][i]}px"></div>`).join('')}
  <div style="left:44px;top:730px;width:240px;height:2px;background:#9aa3ae"></div>
  <div style="left:356px;top:730px;width:240px;height:2px;background:#9aa3ae"></div>
  <div class="ln" style="top:742px;font-size:15px;color:#7a8391">Vendedor</div>
  <div class="ln" style="top:742px;left:356px;font-size:15px;color:#7a8391">Comprador</div>
  <div class="hl" id="hl1" style="left:30px;top:558px;width:580px;height:104px"></div>
</div>`);
s1.appendChild(doc1);
const stamp=$(`<div style="left:${(W-560)/2}px;top:${docY+250}px;width:560px;text-align:center;font:800 64px Poppins;letter-spacing:.08em;color:var(--red2);border:7px solid var(--red2);border-radius:14px;padding:6px 0;transform-origin:50% 50%;background:rgba(247,248,249,.0)">NEGÓCIO SUSPENSO</div>`);
s1.appendChild(stamp);
const alert1=$(`<div class="tag" style="left:${W/2+110}px;top:${docY+520}px;font-size:22px;padding:12px 18px">⚠ RISCO NÃO VERIFICADO</div>`);
s1.appendChild(alert1);
const ph2=$(`<div style="left:0;width:${W}px;top:${TALL?1400:1010}px;text-align:center;font:700 ${TALL?72:64}px/1.2 Poppins;color:#fff">
  <div style="position:relative;display:inline-block;background:rgba(10,22,40,.9);padding:16px 34px;border-radius:18px">E o risco já estava<br><span class="gold">nos documentos.</span></div></div>`);
s1.appendChild(ph2);

function S1(lt,dur){
  // notificação
  const tn=eo(rp(lt,.02,.4)); put(toast,{y:lerp(-220,0,tn),o:tn*(1-rp(lt,2.3,2.7))});
  // manchete palavra a palavra
  hl1w.forEach((w,i)=>{const p=eb(rp(lt,hl1t[i]-.04,hl1t[i]+.22));put(w,{y:lerp(40,0,p),o:cl(p*1.4),s:lerp(.85,1,p)});});
  put(hl1,{o:1-rp(lt,2.35,2.7),y:-40*eio(rp(lt,2.35,2.8))});
  // documento + câmera
  const z=eio(rp(lt,2.3,4.4));
  const enter=eo(rp(lt,.05,.7));
  put(doc1,{y:lerp(160,0,enter)-z*(TALL?560:430),s:lerp(TALL?.9:.66,TALL?1.55:1.25,z)*lerp(.95,1,enter),r:lerp(-4,-1,z),o:enter,
            extra:`perspective(1600px) rotateX(${lerp(22,6,z)}deg)`});
  document.getElementById('hl1').style.opacity=rp(lt,1.0,1.15)*(0.65+0.35*Math.sin(lt*14));
  const sp=rp(lt,1.15,1.45); put(stamp,{s:lerp(2.4,1,eo(sp)),r:-9,o:sp*(1-rp(lt,2.3,2.6)),y:-z*300});
  const ap=eb(rp(lt,.75,1.0)); put(alert1,{s:ap,o:cl(ap)*(1-rp(lt,2.3,2.6))});
  const pp=eo(rp(lt,2.6,3.0)); put(ph2,{y:lerp(50,0,pp),o:pp});
}

// ======================================================================
//  CENA 2 — A DOR REAL (montagem de documentos)
// ======================================================================
const s2=scene('s2');
const Z2=TALL?1.22:1, CW=700, CH=560, CX=(W/Z2-CW)/2, CY=TALL?(L.cardY+10)/Z2:L.cardY;
const cards=[
 {kw:'Dívidas ocultas.', tag:'GRAVAME', html:`
   <div class="hd">REGISTRO DE IMÓVEIS</div><div class="tt">MATRÍCULA Nº 48.217</div>
   <div class="ln" style="top:118px;color:#6b7380;font-size:17px">Ficha 01 · Livro 2 — Registro Geral</div>
   <div class="ln" style="top:160px"><b>R.1</b> — Compra e venda</div>${[198,224].map((y,i)=>`<div class="bar" style="top:${y}px;width:${[560,470][i]}px"></div>`).join('')}
   <div class="ln" style="top:258px"><b>R.2</b> — Alienação fiduciária</div>${[296,322].map((y,i)=>`<div class="bar" style="top:${y}px;width:${[520,560][i]}px"></div>`).join('')}
   <div class="ln" style="top:360px;color:#8a2a26"><b>AV.3</b> — PENHORA · Ação de execução</div>${[398,424].map((y,i)=>`<div class="bar" style="top:${y}px;width:${[540,400][i]}px;background:#efd5d3"></div>`).join('')}
   <div class="hl hlx" style="left:28px;top:346px;width:${CW-56}px;height:104px"></div>`, hlY:346},
 {kw:'Documentação irregular.', tag:'DIVERGÊNCIA', html:`
   <div class="hd">ÁREA CONSTRUÍDA</div><div class="tt">CONFERÊNCIA DE REGISTROS</div>
   <div style="left:44px;top:140px;width:${CW-88}px;height:150px;border:1px solid #dde1e7;border-radius:12px">
     <div class="ln" style="left:24px;top:22px;font-size:17px;color:#6b7380">MATRÍCULA (AVERBAÇÃO)</div>
     <div style="left:24px;top:54px;font:700 54px Poppins;color:var(--navy)">120,00 m²</div></div>
   <div style="left:44px;top:310px;width:${CW-88}px;height:150px;border:1px solid #dde1e7;border-radius:12px">
     <div class="ln" style="left:24px;top:22px;font-size:17px;color:#6b7380">CADASTRO MUNICIPAL (IPTU)</div>
     <div style="left:24px;top:54px;font:700 54px Poppins;color:#8a2a26">186,40 m²</div></div>
   <div style="right:70px;top:250px;width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;font:800 52px/80px Poppins;text-align:center">≠</div>
   <div class="hl hlx" style="left:30px;top:300px;width:${CW-60}px;height:170px"></div>`},
 {kw:'Riscos ignorados.', tag:'ATENÇÃO', html:`
   <div class="hd">CERTIDÃO</div><div class="tt">DISTRIBUIÇÃO DE AÇÕES</div>
   <div class="ln" style="top:118px;color:#6b7380;font-size:17px">Pesquisa em nome do vendedor</div>
   ${[170,196,222].map((y,i)=>`<div class="bar" style="top:${y}px;width:${[540,580,420][i]}px"></div>`).join('')}
   <div class="ln" style="top:270px;font-weight:600">RESULTADO:</div>
   <div style="left:44px;top:308px;font:800 50px Poppins;color:#8a2a26;letter-spacing:.04em">CONSTA</div>
   <div class="ln" style="top:378px">1 ação de execução em andamento</div>
   <div class="hl hlx" style="left:28px;top:296px;width:${CW-56}px;height:126px"></div>`},
 {kw:'Responsabilidade profissional.', tag:'AGUARDANDO', html:`
   <div class="hd">INSTRUMENTO PARTICULAR</div><div class="tt">CONTRATO DE<br>COMPRA E VENDA</div>
   ${[160,186,212,238,264,290].map((y,i)=>`<div class="bar" style="top:${y}px;width:${[560,520,580,480,560,300][i]}px"></div>`).join('')}
   <div class="ln" style="top:330px;font-weight:600">Assinaturas</div>
   <div style="left:44px;top:430px;width:250px;height:2px;background:#9aa3ae"></div>
   <div style="left:${CW-294}px;top:430px;width:250px;height:2px;background:#9aa3ae"></div>
   <div class="sigc" style="left:60px;top:388px;width:4px;height:36px;background:var(--navy)"></div>
   <div class="hl hlx" style="left:28px;top:370px;width:${CW-56}px;height:84px;border-color:var(--gold);background:rgba(203,162,54,.12)"></div>`},
];
cards.forEach((c,i)=>{
  c.el=$(`<div class="paper" style="left:${CX}px;top:${CY}px;width:${CW}px;height:${CH}px;transform-origin:50% 50%">${c.html}
    <div class="scan" style="left:0;width:100%;height:120px;top:0;background:linear-gradient(180deg,rgba(203,162,54,0),rgba(203,162,54,.28) 85%,rgba(203,162,54,.9));"></div></div>`);
  s2.appendChild(c.el);c.el.style.zoom=Z2;
  c.tagEl=$(`<div class="tag" style="left:${(CX+CW)*Z2-(TALL?170:40)}px;top:${CY*Z2-24}px;${TALL?'font-size:21px;':''}transform-origin:0 50%;${i==3?'background:var(--gold);color:var(--navy2)':''}">${c.tag}</div>`);
  s2.appendChild(c.tagEl);
  c.kwEl=$(`<div class="kw" style="top:${L.kwY}px;font-size:${c.kw.length>24?Math.round(L.kwS*(TALL?.7:.74)):L.kwS}px">${c.kw.replace(/(\S+)\.$/,'<span class="gold" style="position:static">$1.</span>')}</div>`);
  s2.appendChild(c.kwEl);
});
function S2(lt,dur){
  const step=(dur-.2)/4;

    pg.beginPath();pg.moveTo(ox+w[0]*k,oy+w[1]*k);pg.lineTo(ox+(w[0]+(w[2]-w[0])*f)*k,oy+(w[1]+(w[3]-w[1])*f)*k);pg.stroke()}
  pg.shadowBlur=0;pg.lineWidth=2;pg.strokeStyle=`rgba(214,183,109,${.6*rp(p,.6,1)})`;
  [[5,4,1.2,0],[3.6,4,1.2,1],[9,6,1.2,0],[1.4,7,1.2,1]].forEach(([x,y,r,d])=>{pg.beginPath();pg.arc(ox+x*k,oy+y*k,r*k,d?0:Math.PI/2,d?Math.PI/2:Math.PI);pg.stroke()});
  pg.fillStyle=`rgba(226,232,240,${.55*rp(p,.7,1)})`;pg.font='600 30px Poppins';pg.textAlign='center';
  ROOMS.forEach(([n,x,y])=>pg.fillText(n,ox+x*k,oy+y*k));
  // varredura
  const sx=ox+((t*0.35)%1.2-.1)*14*k;const gr=pg.createLinearGradient(sx-120,0,sx,0);gr.addColorStop(0,'rgba(203,162,54,0)');gr.addColorStop(1,'rgba(203,162,54,.25)');
  pg.fillStyle=gr;pg.fillRect(sx-120,oy-60,120,10*k+120);
}
function S6(lt,dur){
  const A = V==='short'? .5 : 1.9;    // instante da revelação da marca
  drawPlan(eio(rp(lt,0,A+1.6)),lt);
  plan.style.transform=`perspective(1500px) rotateX(${lerp(62,48,eio(rp(lt,0,dur)))}deg) rotateZ(${lerp(-18,-6,eio(rp(lt,0,dur)))}deg) scale(${lerp(1.25,1.0,eio(rp(lt,0,dur)))}) translateY(${lerp(140,0,eio(rp(lt,0,dur)))}px)`;
  plan.style.opacity=eo(rp(lt,0,.5));
  shade.style.opacity=lerp(.25,1,eio(rp(lt,A-.2,A+.6)));
  [...ckl.children].forEach((c,i)=>{const p=eb(rp(lt,.15+i*.4,.45+i*.4));put(c,{x:lerp(-80,0,cl(p)),o:cl(p)});});
  put(ckl,{o:V==='short'?0:1-rp(lt,A-.25,A+.1),s:lerp(1,.9,rp(lt,A-.25,A+.1))});
  const lp=eo(rp(lt,A,A+.7)); put(logo,{s:lerp(1.25,1,lp),o:lp,blur:(1-lp)*10});
  logo.querySelector('.shine').style.transform=`translateX(${lerp(0,logoW*4,rp(lt,A+.5,A+1.4))}px)`;
  [...cta.children].forEach((c,i)=>{const p=eo(rp(lt,A+.4+i*.18,A+.9+i*.18));put(c,{y:lerp(40,0,p),o:p});});
  const sp=eo(rp(lt,A+1.1,A+1.6)); put(sub6,{y:lerp(20,0,sp),o:sp});
  const bp=eb(rp(lt,A+1.5,A+1.95)), tap=A+(V==='short'?2.9:3.7), tp=rp(lt,tap,tap+.14)-rp(lt,tap+.14,tap+.3);
  put(btn,{s:cl(bp,0,1.2)*(1-.05*tp)*(1+.018*Math.sin(Math.max(0,lt-A-2)*5)),o:cl(bp)});
  btn.style.boxShadow=`0 0 ${30+20*Math.sin(lt*5)}px rgba(203,162,54,${.35*cl(bp)})`;
  const rpp=rp(lt,tap,tap+.6); put(ripple.firstChild,{s:lerp(.2,1.6,eo(rpp)),o:rpp>0&&rpp<1?1-rpp:0});
  const up=eo(rp(lt,A+1.9,A+2.4)); put(url,{o:up,y:lerp(15,0,up)});
}

// ======================================================================
//  LEGENDAS
// ======================================================================
const cap=$(`<div id="cap" style="top:${L.capY}px"></div>`);stage.appendChild(cap);
const CAPS=[];
CUT.vo.forEach(([id,t0])=>{ if(NOSUB.has(id)) return;
  const [d,txt]=VO[id], max=TALL?28:34, chunks=[];
  const clauses=txt.match(/[^.:?,]+[.:?,]?/g).map(x=>x.trim()).filter(Boolean);
  const parts=[];clauses.forEach(c=>{const n=Math.ceil(c.length/max);if(n<=1){parts.push(c);return}
    const ws=c.split(' ');let cur=[],acc=0,k=1;ws.forEach((w,j)=>{cur.push(w);acc+=w.length+1;
      if(k<n&&acc>=k*c.length/n&&j<ws.length-1){parts.push(cur.join(' '));cur=[];k++}});if(cur.length)parts.push(cur.join(' '))});
  const merged=[];parts.forEach(pt=>{const l=merged.at(-1);if(l&&(l.length<13||pt.length<10)&&(l+' '+pt).length<=max+4)merged[merged.length-1]=l+' '+pt;else merged.push(pt)});
  merged.forEach(m=>chunks.push(m.split(' ')));
  const tot=txt.length;let acc=0;
  chunks.forEach(c=>{const s=c.join(' ');const a=t0+d*acc/tot;acc+=s.length+1;const b=t0+d*Math.min(1,acc/tot);
    CAPS.push({a,b,words:c,wt:wordTimes(s,a,b-a)})});
});
CAPS.forEach((c,i)=>{ if(CAPS[i+1]&&CAPS[i+1].a-c.b<.5) c.b=CAPS[i+1].a; else c.b+=.25; });
let lastCap=-1;
function CAP(t){
  const i=CAPS.findIndex(c=>t>=c.a&&t<c.b);
  if(i<0){cap.style.opacity=0;return}
  const c=CAPS[i];
  if(i!==lastCap){cap.innerHTML=`<span class="box">${c.words.map(w=>`<span>${w}</span>`).join(' ')}</span>`;lastCap=i}
  const sp=[...cap.querySelectorAll('.box span')]; sp.forEach((s,k)=>s.className= t>=c.wt[k] && (k==sp.length-1||t<c.wt[k+1]) ? 'on':'');
  cap.style.opacity=cl((t-c.a)/.08)*cl((c.b-t)/.08); cap.style.transform=`translateY(${(1-eo(cl((t-c.a)/.15)))*10}px)`;
}

// ======================================================================
//  FUNDO (canvas): gradiente, grade técnica, arcos da marca, partículas,
//  edifício em wireframe 3D e vinheta de tensão
// ======================================================================
const RP=rng(42); const PTS=[...Array(70)].map(()=>({x:RP()*W,y:RP()*H,z:.3+RP()*.7,ph:RP()*6.28}));
function sceneAt(t){for(const [id,a,b] of CUT.scenes) if(t>=a&&t<b) return [id,a,b]; const l=CUT.scenes.at(-1);return [l[0],l[1],l[2]]}
function startOf(id){const s=CUT.scenes.find(x=>x[0]===id);return s?s[1]:null}
function building(t,cx,cy,sc,ang,alpha,prog){
  const E=[],w=1.1,d=.8,h=3.6,fl=12;const V3=[];
  const P=(x,y,z)=>{const ca=Math.cos(ang),sa=Math.sin(ang);let X=x*ca-z*sa,Z=x*sa+z*ca;const tilt=.32;let Y=y*Math.cos(tilt)-Z*Math.sin(tilt);Z=y*Math.sin(tilt)+Z*Math.cos(tilt);const f=5/(5+Z);return [cx+X*sc*f,cy-Y*sc*f]};
  const c=[[-w,-d],[w,-d],[w,d],[-w,d]];
  for(let i=0;i<=fl;i++){const y=i*h/fl-h/2;for(let k=0;k<4;k++)E.push([[c[k][0],y,c[k][1]],[c[(k+1)%4][0],y,c[(k+1)%4][1]],i/fl])}
  for(let k=0;k<4;k++){E.push([[c[k][0],-h/2,c[k][1]],[c[k][0],h/2,c[k][1]],0]);E.push([[(c[k][0]+c[(k+1)%4][0])/2,-h/2,(c[k][1]+c[(k+1)%4][1])/2],[(c[k][0]+c[(k+1)%4][0])/2,h/2,(c[k][1]+c[(k+1)%4][1])/2],.5])}
  g.lineWidth=1.6;
  E.forEach(([a,b,lv])=>{const vis=cl((prog-lv)*6);if(vis<=0)return;const A=P(...a),B=P(...b);g.strokeStyle=`rgba(203,162,54,${alpha*vis*(lv%0.5===0?.9:.55)})`;g.beginPath();g.moveTo(...A);g.lineTo(...B);g.stroke()});
}
function BG(t){
  const [id]=sceneAt(t); const T4=startOf('s4')??CUT.dur, calm=rp(t,T4-.4,T4+.6);
  const gr=g.createRadialGradient(W/2,H*.42,50,W/2,H*.5,H*.85);
  gr.addColorStop(0,'#1d2c42');gr.addColorStop(.55,'#111f34');gr.addColorStop(1,'#0a1628');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // grade técnica com parallax
  const off=(t*14)%90;g.lineWidth=1;g.strokeStyle=`rgba(${calm>0.5?'203,162,54':'226,232,240'},${.035+.02*calm})`;
  for(let x=-90+off;x<W+90;x+=90){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  for(let y=-90+off*.6;y<H+90;y+=90){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  // arcos concêntricos (motivo da página oficial)
  g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1.5;
  [430,600,780].forEach((r,i)=>{g.beginPath();g.arc(W*.92+Math.sin(t*.2+i)*10,H*.12,r+Math.sin(t*.3)*6,0,Math.PI*2);g.stroke()});
  // edifício wireframe na solução e no fechamento
  const s4a=startOf('s4'); if(s4a!==null){const lt=t-s4a, a4=rp(lt,0,.8)*(1-rp(t,(startOf('s5')??CUT.dur)-.2,(startOf('s5')??CUT.dur)+.3));
    if(a4>0){building(t,W*.5,TALL?H*.48:H*.47,TALL?230:200,.5+lt*.18,.30*a4,rp(lt,0,2.4)); }}
  // vinheta vermelha de tensão (gancho e dor)
  const tense=(1-calm)*(id==='s1'?.9:id==='s2'?.55:.25);
  if(tense>0){const pulse=.5+.5*Math.sin(t*5.2);const vg=g.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);
    vg.addColorStop(0,'rgba(164,59,56,0)');vg.addColorStop(1,`rgba(164,59,56,${.20*tense*(.6+.4*pulse)})`);g.fillStyle=vg;g.fillRect(0,0,W,H)}
  // brilho dourado na resolução
  if(calm>0){const gg=g.createRadialGradient(W/2,H*.4,0,W/2,H*.4,H*.6);gg.addColorStop(0,`rgba(203,162,54,${.10*calm})`);gg.addColorStop(1,'rgba(203,162,54,0)');g.fillStyle=gg;g.fillRect(0,0,W,H)}
  // partículas discretas
  PTS.forEach(p=>{const y=(p.y-t*18*p.z+H*10)%H, x=p.x+Math.sin(t*.4+p.ph)*20;const a=(.25+.35*Math.sin(t*1.3+p.ph))*p.z;
    g.fillStyle=calm>.5?`rgba(214,183,109,${a})`:`rgba(226,232,240,${a*.7})`;g.beginPath();g.arc(x,y,1.2+1.8*p.z,0,6.283);g.fill()});
  // linha vermelha que atravessa a tela (gancho)
  if(id==='s1'){const lp=rp(t,.12,.5);if(lp>0&&lp<1){const y=lerp(H*.15,H*.85,eio(lp));g.fillStyle='rgba(208,82,75,.95)';g.shadowColor='#d0524b';g.shadowBlur=30;g.fillRect(0,y-2,W,4);g.shadowBlur=0}
    const fl=rp(t,.1,.18)-rp(t,.18,.5); if(fl>0){g.fillStyle=`rgba(208,82,75,${.25*fl})`;g.fillRect(0,0,W,H)} }
}

// ======================================================================
//  SEEK
// ======================================================================
const FN={s1:S1,s2:S2,s3:S3,s4:S4,s5:S5,s6:S6};
window.seek=function(t){
  BG(t);
  const N=CUT.scenes.length;
  CUT.scenes.forEach(([id,a,b],i)=>{
    const el=SC[id]; const fin=i==0?1:eo(rp(t,a-.05,a+.35)); const fout=i==N-1?1:1-rp(t,b-.05,b+.3);
    const o=Math.min(fin,fout);
    if(o<=0.001){el.style.display='none';return}
    el.style.display='block'; el.style.opacity=o;
    el.style.transform=`scale(${lerp(1.04,1,fin)*lerp(1,.97,1-fout)})`;
    el.style.filter=o<.98?`blur(${(1-o)*10}px)`:'none';
    FN[id](t-a,b-a);
  });
  Object.keys(SC).forEach(k=>{if(!CUT.scenes.find(s=>s[0]===k))SC[k].style.display='none'});
  CAP(t);
};

// ---------- pistas para o desenho de som ----------
function cues(){
  const C=[],st=id=>startOf(id),add=(k,t,v=1)=>{if(t!==null&&t>=0&&t<=CUT.dur)C.push([k,+t.toFixed(3),v])};
  add('notif',.04);add('impact',.13);add('zap',.14);add('alert',.78);add('stamp',1.17);add('paper',2.4);add('whoosh',2.35,.6);
  CUT.scenes.forEach(([id,a],i)=>{if(i>0)add('whoosh',a-.05)});
  if(st('s2')!==null){const d=CUT.scenes.find(s=>s[0]==='s2'),step=(d[2]-d[1]-.2)/4;for(let i=0;i<4;i++){const t0=d[1]+.1+i*step;add('swish',t0);add('scan',t0+.3);add('beep',t0+.9)}}
  if(st('s3')!==null){add('pop',st('s3')+.75);add('pop',st('s3')+1.0);add('tick',st('s3')+1.15);}
  const s4=st('s4'); if(s4!==null){add('riser',s4-1.6);add('impact_soft',s4);add('shimmer',s4+.4);
    if(V!=='short') for(let i=0;i<5;i++) add('tick',s4+4.6+.25+i*.62+.5);}
  const s5=st('s5'); if(s5!==null){const d=CUT.scenes.find(s=>s[0]==='s5');for(let i=0;i<4;i++)add('chime',s5+.2+i*Math.min(1.05,(d[2]-d[1]-1.4)/4)+.25,i)}
  const s6=st('s6'); if(s6!==null){const A=V==='short'?.5:1.9; if(V!=='short')for(let i=0;i<3;i++)add('check',s6+.25+i*.4);
    add('impact_final',s6+A);add('shimmer',s6+A+.5);add('click',s6+A+(V==='short'?2.9:3.7));}
  return C.sort((a,b)=>a[1]-b[1]);
}
window.META={v:V,w:W,h:H,fps:30,dur:CUT.dur,vo:CUT.vo,cues:cues(),music_shift:startOf('s4'),
  caps:CAPS.map(c=>[+c.a.toFixed(3),+c.b.toFixed(3),c.words.join(' ')]),voDur:Object.fromEntries(CUT.vo.map(([id])=>[id,VO[id][0]]))};
window.READY=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{seek(0);return true});
</script>
