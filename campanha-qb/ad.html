<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>QB Group — Campanha Manual de Due Diligence Imobiliária</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:400;src:url(fonts/lora-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:400;font-style:italic;src:url(fonts/lora-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:500;src:url(fonts/lora-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Lora;font-weight:600;src:url(fonts/lora-latin-600-normal.woff2) format('woff2')}
:root{
  /* Paleta extraída de qbgroupsolutions.lovable.app (oklch → hex) */
  --navy:#111f34; --navy2:#0a1628; --navy3:#1d2c42; --navy4:#25364f;
  --gold:#cba236; --gold2:#d6b76d; --gold3:#856717;
  --red:#a43b38; --red2:#d0524b;
  --ink:#e2e8f0; --mute:#848d98; --paper:#f7f8f9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy2);overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--navy2);font-family:Poppins,sans-serif;color:var(--ink)}
#stage *{position:absolute}
#stage b,#stage span,#stage br{position:static}
canvas{left:0;top:0}
.scene{left:0;top:0;width:100%;height:100%;transform-origin:50% 50%}
.paper{background:var(--paper);color:var(--navy);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.08);overflow:hidden}
.paper .hd{left:30px;right:30px;top:26px;font:600 14px Poppins;letter-spacing:.2em;color:#6b7380}
.paper .tt{left:30px;right:30px;top:48px;font:700 26px/1.15 Poppins;color:var(--navy)}
.paper .bar{height:10px;border-radius:6px;background:#dde1e7;left:30px}
.paper .ln{left:30px;right:30px;font:500 18px/1.3 Lora;color:#2b3445}
.tag{font:700 17px Poppins;letter-spacing:.16em;padding:8px 14px;border-radius:6px;color:#fff;background:var(--red);white-space:nowrap}
.hl{border:4px solid var(--red2);border-radius:8px;background:rgba(208,82,75,.12)}
.kw{left:0;width:100%;text-align:center;font-weight:800;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.gold{color:var(--gold)}
.panel{background:linear-gradient(180deg,var(--navy3),var(--navy));border:1px solid rgba(255,255,255,.1);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.chip{border:1.5px solid rgba(203,162,54,.55);color:var(--gold);border-radius:999px;font:600 20px Poppins;letter-spacing:.24em;padding:12px 26px;white-space:nowrap;background:rgba(10,22,40,.6)}
.bubble{background:#f1f3f6;color:#1b2536;border-radius:18px 18px 18px 4px;font:500 23px/1.3 Poppins;padding:14px 20px;white-space:nowrap}
.bubble b{font-weight:700;color:#5c6676;display:block;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.step{background:linear-gradient(90deg,rgba(29,44,66,.97),rgba(17,31,52,.95));border:1px solid rgba(255,255,255,.1);border-radius:18px}
.step .n{width:66px;height:66px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);font:700 28px/62px Poppins;text-align:center}
.step .l{font:600 34px Poppins;color:#fff;white-space:nowrap}
.step .ck{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--navy2);font:800 26px/44px Poppins;text-align:center}
.ben{background:linear-gradient(90deg,rgba(29,44,66,.95),rgba(17,31,52,.85));border:1px solid rgba(255,255,255,.09);border-left:4px solid var(--gold);border-radius:16px}
.ben .ic{width:76px;height:76px;border-radius:50%;border:2px solid rgba(203,162,54,.7);display:flex;align-items:center;justify-content:center}
.ben .ic svg{position:static;width:40px;height:40px}
.ben .tx{font:600 34px/1.2 Poppins;color:#fff}
.tall .ben .tx{font-size:37px}
.btn{background:var(--gold);color:var(--navy2);font:800 40px Poppins;letter-spacing:.06em;border-radius:14px;text-align:center;white-space:nowrap}
/* adesivos */
.stk{font:800 30px/1 Poppins;padding:13px 22px 12px;border-radius:14px;border:4px solid #fff;white-space:nowrap;box-shadow:0 12px 26px rgba(0,0,0,.45);letter-spacing:.01em;transform-origin:50% 50%}
.tall .stk{font-size:35px;padding:15px 26px 14px}
.stk.red{background:var(--red2);color:#fff}
.stk.gold{background:var(--gold);color:var(--navy2)}
.stk.white{background:#fff;color:var(--navy);border-color:var(--red2)}
.stk.ok{background:var(--navy2);color:var(--gold);border-color:var(--gold)}
#cap{left:60px;right:60px;text-align:center}
#cap span.box{position:relative;display:inline-block;background:rgba(10,22,40,.85);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 26px;font:600 42px/1.3 Poppins;color:#fff}
.tall #cap span.box{font-size:52px;padding:14px 30px}
#cap span.box span{position:static}
#cap .on{color:var(--gold)}
</style>
</head>
<body>
<div id="stage"></div>
<script src="vo_durations.js"></script>
<script>
// ======================================================================
//  QB GROUP SOLUTIONS — "Negociações Imobiliárias com Segurança Jurídica"
//  Composição determinística: window.seek(t) desenha o quadro do instante t.
//  ?v=feed (1080x1350) | story (1080x1920) | short (1080x1920, corte curto)
//  A linha do tempo é calculada a partir da duração real de cada fala
//  (vo_durations.js, gerado no build); sem ele, usa estimativas.
// ======================================================================
const V = new URLSearchParams(location.search).get('v') || 'feed';
const W = 1080, H = V === 'feed' ? 1350 : 1920, TALL = V !== 'feed';

const VOTXT = {
  s1a:'Já imaginou? O negócio cai na véspera da escritura…',
  s1b:'e quem é responsabilizado é você!',
  s2a:'Uma informação não verificada pode derrubar a negociação inteira!',
  s2b:'E o problema nem sempre aparece na visita: está nos registros, nos detalhes que passam despercebidos.',
  s3a:'Você é advogado ou corretor de imóveis?',
  s3b:'Não basta conduzir a negociação. É preciso saber quais riscos investigar!',
  s4a:'Com o Manual de Due Diligence Imobiliária, da QB Group,',
  s4b:'você tem o roteiro completo: o que investigar, em que ordem, e com qual documento!',
  s5a:'Mais critério para identificar sinais de alerta.',
  s5b:'Mais clareza para comunicar riscos.',
  s5c:'E mais valor para o seu trabalho!',
  s6a:'Não espere o problema aparecer!',
  s6b:'Garanta o Manual de Due Diligence Imobiliária. Acesse a página e saiba mais!',
  c2:'Manual de Due Diligence Imobiliária, da QB Group.',
  c3:'Garanta o seu! Acesse a página e saiba mais.',
};
const VOD = Object.assign({s1a:3.1,s1b:1.9,s2a:3.6,s2b:5.6,s3a:2.4,s3b:4.3,s4a:4.2,s4b:3.9,s5a:2.4,s5b:2.0,s5c:2.0,s6a:1.6,s6b:5.0,c2:3.8,c3:2.8}, window.VODUR||{});
const VOW = window.VOWORDS||{};
// início absoluto de cada palavra de uma fala (alinhamento real se houver; senão proporcional)
function wordStarts(id,t0){const n=VOTXT[id].split(' ').length;return VOW[id]&&VOW[id].length===n?VOW[id].map(w=>t0+w[0]):wordTimes(VOTXT[id],t0,VOD[id])}
const NOSUB = new Set(['s1a','s1b']);   // o gancho já é a tipografia na tela

// ---------- montagem: cenas guiadas pelas falas ----------
const PLAN = {
  feed:[['s1',['s1a','s1b'],{pre:.2,gap:0,post:.5}],['s2',['s2a','s2b'],{pre:.3,gap:0,post:.5,min:10}],
        ['s3',['s3a','s3b'],{pre:.2,gap:0,post:.45}],['s4',['s4a','s4b'],{pre:.3,gap:0,post:1.3}],
        ['s5',['s5a','s5b','s5c'],{pre:.3,gap:0,post:.7,min:6}],['s6',['s6a','s6b'],{pre:.25,gap:.2,post:2.0}]],
  story:[['s1',['s1a','s1b'],{pre:.2,gap:0,post:.5}],['s2',['s2a','s2b'],{pre:.3,gap:0,post:.5,min:10}],
        ['s3',['s3a'],{pre:.2,post:.5,min:2.8}],['s4',['s4a','s4b'],{pre:.3,gap:0,post:1.3}],
        ['s5',['s5a','s5b','s5c'],{pre:.3,gap:0,post:.7,min:6}],['s6',['s6a','s6b'],{pre:.25,gap:.2,post:2.0}]],
  short:[['s1',['s1a','s1b'],{pre:.2,gap:0,post:.5}],['s4',['c2'],{pre:.3,post:.6,min:4.6}],['s6',['c3'],{pre:.9,post:1.6,min:5.2}]],
};
const CUT={scenes:[],vo:[],dur:0}, VOT={};
{ let t=0; for(const [id,ids,o] of PLAN[V]){ let x=o.pre; const loc={};
    ids.forEach((v,k)=>{ if(k) x+=o.gap; loc[v]=x; CUT.vo.push([v,+(t+x).toFixed(3)]); x+=VOD[v]; });
    const d=Math.max(x+o.post,o.min||0); CUT.scenes.push([id,t,t+d]); VOT[id]=loc; t+=d; }
  CUT.dur=+t.toFixed(2); }

// ---------- utilidades ----------
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const rp=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pulse=(t,a,d=.25)=>rp(t,a,a+d*.4)-rp(t,a+d*.4,a+d);
function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
function put(el,{x=0,y=0,s=1,r=0,o=1,sx,sy,blur=0,extra=''}){
  el.style.transform=`translate(${x}px,${y}px) scale(${sx??s},${sy??s}) rotate(${r}deg) ${extra}`;
  el.style.opacity=o; el.style.filter=blur>0.05?`blur(${blur}px)`:'none';
}
function wordTimes(text,start,dur){
  const w=text.split(' '),tot=w.reduce((a,b)=>a+b.length+1,0);let acc=0;
  return w.map(x=>{const t0=start+dur*acc/tot;acc+=x.length+1;return t0});
}
const stage=document.getElementById('stage');
stage.style.width=W+'px';stage.style.height=H+'px';if(TALL)stage.classList.add('tall');
const bg=document.createElement('canvas');bg.width=W;bg.height=H;stage.appendChild(bg);
const g=bg.getContext('2d');
const SC={}, WC={};
function scene(id,world){const el=$(`<div class="scene" id="${id}"></div>`);stage.appendChild(el);SC[id]=el;
  if(world){const c=document.createElement('canvas');c.width=W;c.height=H;el.appendChild(c);WC[id]=c.getContext('2d')}return el}
const sStart=id=>{const s=CUT.scenes.find(x=>x[0]===id);return s?s[1]:null};
const L = TALL ? {top:250, hlS:104, kwS:88, capY:1460} : {top:64, hlS:92, kwS:76, capY:1170};

// ---------- adesivos ----------
const STK=[];
function sticker(sc,txt,x,y,r,kind,t,out){ if(!SC[sc])return;
  const el=$(`<div class="stk ${kind}" style="left:${x}px;top:${y}px">${txt}</div>`);SC[sc].appendChild(el);STK.push({sc,el,t,r,out});}
function stickers(sc,lt){ for(const s of STK){ if(s.sc!==sc)continue;
  const p=eb(rp(lt,s.t,s.t+.3)), o=cl(rp(lt,s.t,s.t+.08))*(s.out?1-rp(lt,s.out,s.out+.2):1);
  s.el.style.opacity=o; s.el.style.transform=`translate(-50%,-50%) rotate(${s.r+Math.sin(lt*2.6+s.t*7)*1.6}deg) scale(${lerp(.2,1,p)*(s.out?1-.3*rp(lt,s.out,s.out+.2):1)})`; } }

// ======================================================================
//  ILUSTRAÇÃO (canvas): pessoas, obra, guindaste, placas, casa, loteamento
// ======================================================================
const COL={navy:'#111f34',navy2:'#0a1628',navy3:'#1d2c42',navy4:'#25364f',gold:'#cba236',gold2:'#d6b76d',red:'#a43b38',red2:'#d0524b',ink:'#e2e8f0',paper:'#f7f8f9',
  facade:'#2a3c58',facade2:'#22324b',win:'#0e1a2c',ground:'#0c1727'};
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,6.2832);c.fill()}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function ground(c,gy,a=1){c.save();c.globalAlpha=a;c.fillStyle=COL.ground;c.fillRect(0,gy,W,H-gy);c.fillStyle='rgba(203,162,54,.35)';c.fillRect(0,gy,W,3);c.restore()}
// pessoa: x, pé em fy, altura h. o: {type:worker|suit|casual, aL, aR, mood, flip, bob, skin, shirt, badge, paper}
function person(c,x,fy,h,o={}){
  const s=h/160; c.save(); c.translate(x,fy-(o.bob||0)); c.scale(s*(o.flip?-1:1),s); c.lineCap='round';
  const skin=o.skin||'#e2b48f', type=o.type||'casual';
  const pants=type==='worker'?'#2b3b55':type==='suit'?'#18243a':'#33435e';
  const shirt=o.shirt||(type==='worker'?'#3d5170':type==='suit'?COL.navy4:'#5b6f8e');
  const lw=o.walk?Math.sin(o.walk)*12:0;
  c.strokeStyle=pants;c.lineWidth=12;line(c,-8,-62,-9-lw,-2);line(c,8,-62,9+lw,-2);
  c.fillStyle='#0b1220';rr(c,-20-lw,-6,18,8,4);c.fill();rr(c,2+lw,-6,18,8,4);c.fill();
  c.fillStyle=shirt;rr(c,-22,-120,44,64,14);c.fill();
  if(type==='worker'){c.fillStyle=COL.gold;rr(c,-22,-118,44,58,12);c.fill();c.fillStyle='#e9eef5';c.fillRect(-22,-96,44,5);c.fillRect(-22,-80,44,5);
    c.fillStyle=shirt;c.fillRect(-6,-118,12,58)}
  if(type==='suit'){c.fillStyle='#f3f5f8';c.beginPath();c.moveTo(-9,-120);c.lineTo(9,-120);c.lineTo(0,-92);c.fill();
    c.fillStyle=COL.red2;c.beginPath();c.moveTo(-3,-116);c.lineTo(3,-116);c.lineTo(4,-90);c.lineTo(0,-84);c.lineTo(-4,-90);c.fill()}
  if(o.badge){c.fillStyle=COL.gold;rr(c,-20,-74,40,13,3);c.fill();c.fillStyle=COL.navy2;c.font='800 9px Poppins';c.textAlign='center';c.fillText(o.badge,0,-64.5)}
  const arm=(sx,a,side)=>{const ex=sx+side*Math.sin(a)*50, ey=-112+Math.cos(a)*50;c.strokeStyle=shirt;c.lineWidth=11;line(c,sx,-112,ex,ey);
    c.fillStyle=skin;circ(c,ex,ey,7);return [ex,ey]};
  const hl=arm(-19,o.aL??.18,-1), hr=arm(19,o.aR??.18,1);
  if(o.paper){c.save();c.translate(hr[0],hr[1]);c.rotate(-.2);c.fillStyle=COL.paper;c.fillRect(-4,-26,26,34);c.fillStyle='#c5ccd6';for(let i=0;i<4;i++)c.fillRect(0,-20+i*7,18,3);c.restore()}
  c.fillStyle=skin;circ(c,0,-142,21);
  if(type==='worker'){c.fillStyle=COL.gold;c.beginPath();c.arc(0,-148,22,Math.PI,0);c.fill();rr(c,-27,-150,54,7,3);c.fill();c.fillStyle=COL.gold2;c.fillRect(-3,-170,6,20)}
  else{c.fillStyle=o.hair||'#2a1c14';c.beginPath();c.arc(0,-147,21,Math.PI*1.05,Math.PI*1.95);c.fill()}
  const m=o.mood||'neutral';c.fillStyle=COL.navy2;circ(c,-7,-143,2.8);circ(c,7,-143,2.8);
  c.strokeStyle=COL.navy2;c.lineWidth=3;
  if(m==='angry'){line(c,-13,-153,-3,-149);line(c,13,-153,3,-149);c.beginPath();c.arc(0,-124,7,1.15*Math.PI,1.85*Math.PI);c.stroke()}
  else if(m==='shock'){line(c,-12,-154,-3,-156);line(c,12,-154,3,-156);c.fillStyle=COL.navy2;c.beginPath();c.ellipse(0,-129,5,7,0,0,6.3);c.fill()}
  else if(m==='worried'){line(c,-12,-151,-3,-155);line(c,12,-151,3,-155);line(c,-5,-130,5,-131);
    c.fillStyle='#7fb3e6';c.beginPath();c.moveTo(19,-158);c.quadraticCurveTo(25,-148,19,-145);c.quadraticCurveTo(13,-148,19,-158);c.fill()}
  else if(m==='happy'){c.beginPath();c.arc(0,-136,8,.15*Math.PI,.85*Math.PI);c.stroke()}
  else line(c,-5,-131,5,-131);
  c.restore();
}
function bubble(c,x,y,txt,a,o={}){ if(a<=0)return; const fs=(o.fs||(TALL?30:26));c.save();c.font=`700 ${fs}px Poppins`;
  const w=c.measureText(txt).width+34,h=fs+26, bx=x-w*(o.ax??.5), by=y-h-16, p=eb(cl(a));
  c.translate(x,y);c.scale(p,p);c.translate(-x,-y);c.globalAlpha=cl(a*3);
  c.fillStyle=o.bg||'#ffffff';c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=14;rr(c,bx,by,w,h,16);c.fill();
  c.beginPath();c.moveTo(x-10,by+h-2);c.lineTo(x,y);c.lineTo(x+12,by+h-2);c.fill();c.shadowBlur=0;
  c.fillStyle=o.fg||COL.navy2;c.textAlign='left';c.textBaseline='middle';c.fillText(txt,bx+17,by+h/2+1);c.restore()}
function building(c,cx,gy,w,fh,n,prog,lit,o={}){ const full=Math.floor(cl(prog,0,n)), part=cl(prog,0,n)-full; c.save();
  for(let i=0;i<full;i++){const y=gy-(i+1)*fh;c.fillStyle=i%2?COL.facade:COL.facade2;c.fillRect(cx-w/2,y,w,fh);
    const nw=4,ww=w/nw*.5;for(let k=0;k<nw;k++){const wx=cx-w/2+(k+.25)*w/nw;const on=lit>((i*7+k*3)%10)/10;
      c.fillStyle=on?COL.gold2:COL.win;c.fillRect(wx,y+fh*.22,ww,fh*.5)}
    c.fillStyle='rgba(0,0,0,.25)';c.fillRect(cx-w/2,y+fh-4,w,4)}
  if(part>0){const y=gy-full*fh;c.strokeStyle=COL.gold;c.lineWidth=3;c.globalAlpha=.85;
    for(let k=0;k<=4;k++)line(c,cx-w/2+k*w/4,y,cx-w/2+k*w/4,y-fh*part);line(c,cx-w/2,y-fh*part,cx+w/2,y-fh*part);c.globalAlpha=1}
  if(prog>=n){c.fillStyle=COL.navy4;c.fillRect(cx-w/2-8,gy-n*fh-10,w+16,10)}
  c.restore()}
function crane(c,x,gy,h,jib,trolley,hookLen,load){ c.save();c.strokeStyle=COL.gold;c.lineWidth=4;const top=gy-h;
  line(c,x-12,gy,x-12,top);line(c,x+12,gy,x+12,top);c.lineWidth=2;for(let y=gy;y>top;y-=34){line(c,x-12,y,x+12,y-34);line(c,x+12,y,x-12,y-34)}
  c.lineWidth=5;line(c,x+70,top,x-jib,top);c.lineWidth=2;line(c,x,top-50,x-jib*.6,top);line(c,x,top-50,x+70,top);line(c,x-12,top,x,top-50);line(c,x+12,top,x,top-50);
  c.fillStyle=COL.navy4;c.fillRect(x+40,top-4,34,26);c.fillStyle=COL.gold2;c.fillRect(x+16,top+2,22,18);
  const tx=x-jib*trolley;c.strokeStyle='#9fb0c8';c.lineWidth=2;line(c,tx,top,tx,top+hookLen);
  c.fillStyle=COL.gold;c.fillRect(tx-7,top-3,14,8);if(load)load(tx,top+hookLen);c.restore()}
function board(c,cx,cy,w,h,txt,o={}){ c.save();c.translate(cx,cy);c.rotate(o.r||0);c.scale(o.sx??1,o.sy??1);
  if(o.post){c.fillStyle='#5a4630';c.fillRect(-w*.32-6,0,12,o.post);c.fillRect(w*.32-6,0,12,o.post)}

sticker('s6','7 dias de garantia',TALL?820:830,uy+(TALL?20:16),6,'ok',A6+2.5);

const WALLS=[[0,0,14,0],[14,0,14,10],[14,10,0,10],[0,10,0,0],[5,0,5,4],[5,5.2,5,10],[0,4,3.6,4],[9,0,9,6],[9,7.2,9,10],[5,6,8,6],[9,6,14,6],[11.5,6,11.5,10],[0,7,1.4,7],[2.6,7,5,7]];
const ROOMS=[['SALA',2.5,2],['COZINHA',7,2.6],['SUÍTE',11.5,3],['QUARTO',2.5,8.5],['BANHO',10.2,8.2],['VARANDA',7,8.6]];
function drawPlan(p,t){
  pg.clearRect(0,0,1400,1400);const k=90,ox=(1400-14*k)/2,oy=(1400-10*k)/2;
  pg.strokeStyle='rgba(203,162,54,.10)';pg.lineWidth=1;
  for(let i=0;i<=28;i++){pg.beginPath();pg.moveTo(ox+i*k/2,oy-60);pg.lineTo(ox+i*k/2,oy+10*k+60);pg.stroke()}
  for(let j=0;j<=20;j++){pg.beginPath();pg.moveTo(ox-60,oy+j*k/2);pg.lineTo(ox+14*k+60,oy+j*k/2);pg.stroke()}
  const tot=WALLS.reduce((a,w)=>a+Math.hypot(w[2]-w[0],w[3]-w[1]),0);let left=p*tot;
  pg.strokeStyle='#cba236';pg.lineWidth=7;pg.lineCap='round';pg.shadowColor='rgba(203,162,54,.8)';pg.shadowBlur=18;
  for(const w of WALLS){const len=Math.hypot(w[2]-w[0],w[3]-w[1]);if(left<=0)break;const f=Math.min(1,left/len);left-=len;
    pg.beginPath();pg.moveTo(ox+w[0]*k,oy+w[1]*k);pg.lineTo(ox+(w[0]+(w[2]-w[0])*f)*k,oy+(w[1]+(w[3]-w[1])*f)*k);pg.stroke()}
  pg.shadowBlur=0;pg.fillStyle=`rgba(226,232,240,${.55*rp(p,.7,1)})`;pg.font='600 30px Poppins';pg.textAlign='center';
  ROOMS.forEach(([n,x,y])=>pg.fillText(n,ox+x*k,oy+y*k));
}
function S6(lt,dur){
  const A=A6;
  drawPlan(eio(rp(lt,0,A+1.6)),lt);
  plan.style.transform=`perspective(1500px) rotateX(${lerp(62,48,eio(rp(lt,0,dur)))}deg) rotateZ(${lerp(-18,-6,eio(rp(lt,0,dur)))}deg) scale(${lerp(1.25,1.0,eio(rp(lt,0,dur)))}) translateY(${lerp(140,0,eio(rp(lt,0,dur)))}px)`;
  plan.style.opacity=eo(rp(lt,0,.5));
  shade.style.opacity=lerp(.25,1,eio(rp(lt,A-.2,A+.6)));
  k6.clearRect(0,0,W,H);const sg=H+10;k6.save();k6.translate(0,lerp(260,0,eo(rp(lt,A,A+1.2))));skyline(k6,sg,.55,rp(lt,A+.4,A+2.2),31);k6.restore();
  [...ckl.children].forEach((c,i)=>{const p=eb(rp(lt,.15+i*.4,.45+i*.4));put(c,{x:lerp(-80,0,cl(p)),o:cl(p)});});
  put(ckl,{o:V==='short'?0:1-rp(lt,A-.25,A+.1),s:lerp(1,.9,rp(lt,A-.25,A+.1))});
  const lp=eo(rp(lt,A,A+.7)); put(logo,{s:lerp(1.25,1,lp),o:lp,blur:(1-lp)*10});
  logo.querySelector('.shine').style.transform=`translateX(${lerp(0,logoW*4,rp(lt,A+.5,A+1.4))}px)`;
  [...cta.children].forEach((c,i)=>{const p=eo(rp(lt,A+.4+i*.18,A+.9+i*.18));put(c,{y:lerp(40,0,p),o:p});});
  const sp=eo(rp(lt,A+1.1,A+1.6)); put(sub6,{y:lerp(20,0,sp),o:sp});
  const bp=eb(rp(lt,A+1.5,A+1.95)), tap=A+(V==='short'?2.9:3.7), tp=rp(lt,tap,tap+.14)-rp(lt,tap+.14,tap+.3);
  put(btn,{s:cl(bp,0,1.2)*(1-.05*tp)*(1+.018*Math.sin(Math.max(0,lt-A-2)*5)),o:cl(bp)});
  btn.style.boxShadow=`0 0 ${30+20*Math.sin(lt*5)}px rgba(203,162,54,${.35*cl(bp)})`;
  const rpp=rp(lt,tap,tap+.6); put(ripple.firstChild,{s:lerp(.2,1.6,eo(rpp)),o:rpp>0&&rpp<1?1-rpp:0});
  const up=eo(rp(lt,A+1.9,A+2.4)); put(url,{o:up,y:lerp(15,0,up)});
  stickers('s6',lt);
}

// ======================================================================
//  LEGENDAS
// ======================================================================
const cap=$(`<div id="cap" style="top:${L.capY}px"></div>`);stage.appendChild(cap);
const CAPS=[];
CUT.vo.forEach(([id,t0])=>{ if(NOSUB.has(id)) return;
  const d=VOD[id],txt=VOTXT[id], max=TALL?28:34, chunks=[];
  const clauses=txt.match(/[^.:?,]+[.:?,]?/g).map(x=>x.trim()).filter(Boolean);
  const parts=[];clauses.forEach(c=>{const n=Math.ceil(c.length/max);if(n<=1){parts.push(c);return}
    const ws=c.split(' ');let cur=[],acc=0,k=1;ws.forEach((w,j)=>{cur.push(w);acc+=w.length+1;
      if(k<n&&acc>=k*c.length/n&&j<ws.length-1){parts.push(cur.join(' '));cur=[];k++}});if(cur.length)parts.push(cur.join(' '))});
  const merged=[];parts.forEach(pt=>{const l=merged.at(-1);if(l&&(l.length<13||pt.length<10)&&(l+' '+pt).length<=max+4)merged[merged.length-1]=l+' '+pt;else merged.push(pt)});
  merged.forEach(m=>chunks.push(m.split(' ')));
  const ws=wordStarts(id,t0);let k=0;
  chunks.forEach((c,ci)=>{const wt=ws.slice(k,k+c.length);k+=c.length;const b=k<ws.length?ws[k]:t0+d;
    CAPS.push({a:wt[0],b,words:c,wt})});
});
CAPS.forEach((c,i)=>{ if(CAPS[i+1]&&CAPS[i+1].a-c.b<.5) c.b=CAPS[i+1].a; else c.b+=.25; });
let lastCap=-1;
function CAP(t){
  const i=CAPS.findIndex(c=>t>=c.a&&t<c.b);
  if(i<0){cap.style.opacity=0;return}
  const c=CAPS[i];
  if(i!==lastCap){cap.innerHTML=`<span class="box">${c.words.map(w=>`<span>${w}</span>`).join(' ')}</span>`;lastCap=i}
  const sp=[...cap.querySelectorAll('.box span')]; sp.forEach((s,k)=>s.className= t>=c.wt[k] && (k==sp.length-1||t<c.wt[k+1]) ? 'on':'');
  cap.style.opacity=cl((t-c.a)/.08)*cl((c.b-t)/.08); cap.style.transform=`translateY(${(1-eo(cl((t-c.a)/.15)))*10}px)`;
}

// ======================================================================
//  FUNDO: gradiente, grade técnica, arcos da marca, partículas, tensão
// ======================================================================
const RP=rng(42); const PTS=[...Array(70)].map(()=>({x:RP()*W,y:RP()*H,z:.3+RP()*.7,ph:RP()*6.28}));
const SLAM=sStart('s1')+SL;
function sceneAt(t){for(const [id,a,b] of CUT.scenes) if(t>=a&&t<b) return id; return CUT.scenes.at(-1)[0]}
function BG(t){
  const id=sceneAt(t); const T4s=sStart('s4')??CUT.dur, calm=rp(t,T4s-.4,T4s+.6);
  const gr=g.createRadialGradient(W/2,H*.42,50,W/2,H*.5,H*.85);
  gr.addColorStop(0,'#1d2c42');gr.addColorStop(.55,'#111f34');gr.addColorStop(1,'#0a1628');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const off=(t*14)%90;g.lineWidth=1;g.strokeStyle=`rgba(${calm>0.5?'203,162,54':'226,232,240'},${.035+.02*calm})`;
  for(let x=-90+off;x<W+90;x+=90){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  for(let y=-90+off*.6;y<H+90;y+=90){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1.5;
  [430,600,780].forEach((r,i)=>{g.beginPath();g.arc(W*.92+Math.sin(t*.2+i)*10,H*.12,r+Math.sin(t*.3)*6,0,Math.PI*2);g.stroke()});
  const tense=(1-calm)*(id==='s1'?.9:id==='s2'?.6:.3);
  if(tense>0){const pl=.5+.5*Math.sin(t*5.2);const vg=g.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);
    vg.addColorStop(0,'rgba(164,59,56,0)');vg.addColorStop(1,`rgba(164,59,56,${.20*tense*(.6+.4*pl)})`);g.fillStyle=vg;g.fillRect(0,0,W,H)}
  if(calm>0){const gg=g.createRadialGradient(W/2,H*.4,0,W/2,H*.4,H*.6);gg.addColorStop(0,`rgba(203,162,54,${.10*calm})`);gg.addColorStop(1,'rgba(203,162,54,0)');g.fillStyle=gg;g.fillRect(0,0,W,H)}
  PTS.forEach(p=>{const y=(p.y-t*18*p.z+H*10)%H, x=p.x+Math.sin(t*.4+p.ph)*20;const a=(.25+.35*Math.sin(t*1.3+p.ph))*p.z;
    g.fillStyle=calm>.5?`rgba(214,183,109,${a})`:`rgba(226,232,240,${a*.7})`;g.beginPath();g.arc(x,y,1.2+1.8*p.z,0,6.283);g.fill()});
}
function flashOver(t){const f=pulse(t,SLAM,.45);return f}

// ======================================================================
//  SEEK
// ======================================================================
const FN={s1:S1,s2:S2,s3:S3,s4:S4,s5:S5,s6:S6};
const flash=$(`<div style="left:0;top:0;width:${W}px;height:${H}px;background:#d0524b;pointer-events:none"></div>`);
window.seek=function(t){
  BG(t);
  const sh=Math.exp(-6*Math.max(0,t-SLAM))*(t>=SLAM?1:0), shx=Math.sin(t*90)*18*sh, shy=Math.cos(t*77)*14*sh;
  const N=CUT.scenes.length;
  CUT.scenes.forEach(([id,a,b],i)=>{
    const el=SC[id]; const fin=i==0?1:eo(rp(t,a-.05,a+.35)); const fout=i==N-1?1:1-rp(t,b-.05,b+.3);
    const o=Math.min(fin,fout);
    if(o<=0.001){el.style.display='none';return}
    el.style.display='block'; el.style.opacity=o;
    const punch=id==='s1'?1+.06*Math.exp(-5*Math.max(0,t-SLAM))*(t>=SLAM?1:0):1;
    el.style.transform=`translate(${id==='s1'?shx:0}px,${id==='s1'?shy:0}px) scale(${punch*lerp(1.04,1,fin)*lerp(1,.97,1-fout)})`;
    el.style.filter=o<.98?`blur(${(1-o)*10}px)`:'none';
    FN[id](t-a,b-a);
  });
  Object.keys(SC).forEach(k=>{if(!CUT.scenes.find(s=>s[0]===k))SC[k].style.display='none'});
  flash.style.opacity=.32*flashOver(t);
  CAP(t);
};
stage.appendChild(flash);

// ---------- pistas para o desenho de som ----------
function cues(){
  const C=[],add=(k,t,v=1)=>{if(t!==null&&t>=0&&t<=CUT.dur)C.push([k,+t.toFixed(3),v])};
  const s1=sStart('s1');
  for(let x=.08;x<SL-.1;x+=.19)add('hammer',s1+x);
  add('whoosh',SLAM-.3,.7);add('slam',SLAM);add('buzz',SLAM+.15);add('tape',SLAM+.28);
  add('slam',s1+W1B.at(-2),.45);add('buzz',s1+W1B.at(-2)+.05,.6);
  CUT.scenes.forEach(([id,a],i)=>{if(i>0)add('whoosh',a-.05)});
  const s2=sStart('s2'); if(s2!==null){for(let i=0;i<4;i++){const t0=s2+t2(i);if(i)add('swish',t0-.35);
    add(['flip','engine','buzz','tear'][i],t0+F2);add('buzz',t0+F2+.12,.7)}}
  const s4=sStart('s4'); if(s4!==null){add('riser',s4-1.6);add('impact_soft',s4);add('shimmer',s4+.4);add('clang',s4+RS-.1,.6);add('success',s4+RS+.5);
    if(FL<90) for(let i=0;i<5;i++) add('tick',s4+FL+.25+i*.62+.5);}
  const s5=sStart('s5'); if(s5!==null){const d=CUT.scenes.find(s=>s[0]==='s5');const T5=VOT.s5;[T5.s5a-.1,T5.s5a+VOD.s5a*.5,T5.s5b-.1,T5.s5c-.1].forEach((x,i)=>add('chime',s5+x+.2,i));add('success',s5+T5.s5c+.3)}
  const s6=sStart('s6'); if(s6!==null){if(V!=='short')for(let i=0;i<3;i++)add('check',s6+.25+i*.4);
    add('impact_final',s6+A6);add('shimmer',s6+A6+.5);add('click',s6+A6+(V==='short'?2.9:3.7));}
  for(const s of STK){const st=sStart(s.sc);if(st!==null)add('pop',st+s.t+.02,.8)}
  return C.sort((a,b)=>a[1]-b[1]);
}
window.META={v:V,w:W,h:H,fps:30,dur:CUT.dur,vo:CUT.vo,cues:cues(),music_shift:sStart('s4'),
  caps:CAPS.map(c=>[+c.a.toFixed(3),+c.b.toFixed(3),c.words.join(' ')]),voDur:Object.fromEntries(CUT.vo.map(([id])=>[id,VOD[id]]))};
window.READY=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{seek(0);return true});
</script>
